<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#02020a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Galaxy Shooter</title>
<!-- La fuente carga sin bloquear: si no hay internet el juego usa una fuente del sistema -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" media="print" onload="this.media='all'">
<style>
  :root { --s: 1; }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #02020a; overscroll-behavior: none; touch-action: none; }
  body { position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; color: #e0f7ff; font-family: 'Orbitron', 'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif; }
  #wrap { position: relative; width: 400px; height: 600px; overflow: hidden; background: #02020a; border: 1px solid #3a1d7a; border-radius: 14px; box-shadow: 0 0 40px rgba(106,0,255,.35); touch-action: none; }
  #wrap.full { border: 0; border-radius: 0; box-shadow: none; }
  canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .hide { display: none !important; }

  /* ---------- HUD ---------- */
  #hud { position: absolute; left: 0; right: 0; top: 0; z-index: 5; display: flex; justify-content: space-between; align-items: flex-start; gap: 4px; padding: calc(var(--s) * 8px) calc(var(--s) * 8px) 0; pointer-events: none; }
  #hud .cap { display: block; font-size: calc(var(--s) * 8px); letter-spacing: 1px; opacity: .6; }
  #score { font-size: calc(var(--s) * 22px); color: #00eaff; text-shadow: 0 0 10px rgba(0,234,255,.6); line-height: 1; }
  #hud .sub { margin-top: calc(var(--s) * 3px); font-size: calc(var(--s) * 10px); opacity: .8; white-space: nowrap; }
  .hc { text-align: center; padding-top: 2px; }
  #lives { font-size: calc(var(--s) * 13px); white-space: nowrap; }
  .lv { font-size: calc(var(--s) * 10px); color: #ffd23d; margin-top: 2px; white-space: nowrap; }
  .hr { display: flex; gap: calc(var(--s) * 5px); }
  .hb { pointer-events: auto; touch-action: manipulation; cursor: pointer; position: relative; min-width: 32px; min-height: 32px; width: calc(var(--s) * 35px); height: calc(var(--s) * 35px); border-radius: 10px; border: 1px solid rgba(100,120,220,.6); background: rgba(10,12,34,.72); color: #e0f7ff; font-size: calc(var(--s) * 15px); display: flex; align-items: center; justify-content: center; }
  .hb:active { transform: scale(.94); }
  .hb i { position: absolute; right: 3px; bottom: 0; font-style: normal; font-size: calc(var(--s) * 10px); color: #ffd23d; font-weight: 700; }
  .hb.dim { opacity: .45; }

  /* ---------- Paneles (menú / pausa / game over) ---------- */
  .panel { position: absolute; left: 0; top: 0; right: 0; bottom: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--s) * 12px); padding: calc(var(--s) * 14px); text-align: center; background: radial-gradient(ellipse at center, rgba(12,8,40,.78), rgba(2,2,10,.92)); }
  .logo { font-size: calc(var(--s) * 40px); font-weight: 900; line-height: 1.05; letter-spacing: 3px; color: #00eaff; background: linear-gradient(90deg, #00eaff, #7a4dff, #ff2fb0); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 12px rgba(120,80,255,.6)); }
  .by { font-size: calc(var(--s) * 11px); letter-spacing: 3px; opacity: .7; }
  .rec { font-size: calc(var(--s) * 13px); color: #ffd23d; }
  .panel h2 { font-size: calc(var(--s) * 30px); letter-spacing: 3px; color: #00eaff; }
  .panel h2.over { color: #ff4d6d; }
  .btn { touch-action: manipulation; cursor: pointer; font-family: inherit; font-weight: 700; letter-spacing: 1px; color: #e0f7ff; background: linear-gradient(180deg, #1b1b44, #0d0d24); border: 1px solid #3a3a7a; border-radius: 999px; padding: calc(var(--s) * 11px) calc(var(--s) * 26px); min-height: 44px; min-width: 160px; font-size: calc(var(--s) * 14px); }
  .btn:hover { border-color: #00eaff; }
  .btn:active { transform: scale(.97); }
  .btn.primary { color: #00131a; background: linear-gradient(180deg, #38f2ff, #00a9d6); border-color: #8ffaff; box-shadow: 0 0 22px rgba(0,234,255,.45); font-size: calc(var(--s) * 18px); }
  .btn.ghost { font-size: calc(var(--s) * 12px); opacity: .9; }
  .help { font-size: calc(var(--s) * 10.5px); line-height: 1.7; opacity: .75; max-width: 92%; }
  .help b { color: #ffd23d; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--s) * 8px) calc(var(--s) * 22px); font-size: calc(var(--s) * 11px); }
  .stats span { display: block; opacity: .6; font-size: calc(var(--s) * 9px); letter-spacing: 1px; }
  .stats b { font-size: calc(var(--s) * 17px); color: #00eaff; }
  .badge { color: #1a1200; background: linear-gradient(90deg, #ffd23d, #ff9a3d); padding: calc(var(--s) * 5px) calc(var(--s) * 14px); border-radius: 999px; font-weight: 700; font-size: calc(var(--s) * 12px); }

  /* ---------- Loader ---------- */
  #loader { position: fixed; left: 0; top: 0; right: 0; bottom: 0; z-index: 100; background: radial-gradient(circle at center, #0a0a20 0%, #000 70%); display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity .5s ease; padding: 20px; text-align: center; }
  #loader .t { font-size: 2.2rem; font-weight: 900; letter-spacing: 4px; color: #00eaff; background: linear-gradient(90deg, #00eaff, #6a00ff, #ff00aa); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  #loader .s { margin-top: 10px; font-size: .9rem; opacity: .7; letter-spacing: 2px; }
  #loader .bar { margin-top: 26px; width: 220px; height: 6px; background: #111; border-radius: 10px; overflow: hidden; border: 1px solid #222; }
  #loader .fill { height: 100%; width: 0; background: linear-gradient(90deg, #00eaff, #6a00ff); animation: load 1.5s cubic-bezier(.4,0,.2,1) forwards; }
  #loadMsg { margin-top: 14px; font-size: .75rem; color: #ff8aa0; max-width: 90%; word-break: break-word; }
  @keyframes load { from { width: 0; } to { width: 100%; } }
</style>
</head>
<body>

<div id="loader">
  <div class="t">GALAXY SHOOTER</div>
  <div class="s">By Sxgura Inc</div>
  <div class="bar"><div class="fill"></div></div>
  <div id="loadMsg"></div>
</div>

<div id="wrap">
  <canvas id="game"></canvas>

  <div id="hud" class="hide">
    <div class="hl">
      <div><span class="cap">PUNTOS</span><b id="score">0</b></div>
      <div class="sub">⏱ <span id="time">00:00</span> · 🏆 <span id="high">0</span></div>
    </div>
    <div class="hc">
      <div id="lives">❤️❤️❤️</div>
      <div class="lv" id="lvl">NIVEL 1</div>
    </div>
    <div class="hr">
      <button id="bombBtn" class="hb" aria-label="Bomba">💣<i id="bombs">1</i></button>
      <button id="pauseBtn" class="hb" aria-label="Pausa">⏸</button>
      <button id="soundBtn" class="hb" aria-label="Sonido">🔊</button>
      <button id="fsBtn" class="hb" aria-label="Pantalla completa">⛶</button>
    </div>
  </div>

  <div id="menu" class="panel">
    <div class="logo">GALAXY<br>SHOOTER</div>
    <div class="by">By Sxgura Inc</div>
    <div class="rec">🏆 Récord: <b id="menuHigh">0</b></div>
    <button id="playBtn" class="btn primary">▶ JUGAR</button>
    <button id="menuSound" class="btn ghost">🔊 Sonido: ON</button>
    <div class="help" id="help"></div>
  </div>

  <div id="pausePanel" class="panel hide">
    <h2>PAUSA</h2>
    <button id="resumeBtn" class="btn primary">▶ Continuar</button>
    <button id="restartBtn" class="btn">↻ Reiniciar</button>
    <button id="menuBtn" class="btn ghost">Menú</button>
  </div>

  <div id="overPanel" class="panel hide">
    <h2 class="over">GAME OVER</h2>
    <div id="newRec" class="badge hide">🏆 ¡NUEVO RÉCORD!</div>
    <div class="stats">
      <div><span>PUNTOS</span><b id="oScore">0</b></div>
      <div><span>RÉCORD</span><b id="oHigh">0</b></div>
      <div><span>TIEMPO</span><b id="oTime">00:00</b></div>
      <div><span>NIVEL</span><b id="oLevel">1</b></div>
      <div><span>DERRIBOS</span><b id="oKills">0</b></div>
      <div><span>MEJOR COMBO</span><b id="oCombo">0</b></div>
    </div>
    <button id="againBtn" class="btn primary">↻ Jugar de nuevo</button>
    <button id="menuBtn2" class="btn ghost">Menú</button>
  </div>
</div>

<script>
(function () {
  'use strict';
  var t0 = performance.now();
  var loader = document.getElementById('loader');
  function hideLoader() {
    var wait = Math.max(0, 1500 - (performance.now() - t0));
    setTimeout(function () {
      loader.style.opacity = '0';
      setTimeout(function () { loader.style.display = 'none'; }, 520);
    }, wait);
  }
  try {
    main();
    hideLoader();
  } catch (err) {
    console.error(err);
    var m = document.getElementById('loadMsg');
    if (m) m.textContent = 'Error al iniciar: ' + (err && err.message ? err.message : err);
  }

  function main() {
    // =====================================================================
    //  CONSTANTES Y UTILIDADES
    // =====================================================================
    const W = 400;           // ancho lógico fijo; el alto se adapta a la pantalla
    let H = 600;
    const TAU = Math.PI * 2;
    const FONT = "'Orbitron','Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif";
    const $ = id => document.getElementById(id);
    const wrap = $('wrap'), canvas = $('game');
    const ctx = canvas.getContext('2d', { alpha: false });
    const rnd = (a, b) => a + Math.random() * (b - a);
    const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
    const fmt = s => { s = Math.floor(s); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
    const store = {
      get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
      set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
    };
    const vib = ms => { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} };
    const isTouch = (window.matchMedia && matchMedia('(pointer:coarse)').matches) || ('ontouchstart' in window);
    const gt = {};
    function gate(k, ms) { const n = performance.now(); if (n - (gt[k] || 0) < ms) return false; gt[k] = n; return true; }

    // =====================================================================
    //  SPRITES PRE-RENDERIZADOS (más nitidez y mucho más rápido en móviles)
    // =====================================================================
    const Q = 3;
    function mk(w, h, fn) {
      const c = document.createElement('canvas');
      c.width = Math.ceil(w * Q); c.height = Math.ceil(h * Q);
      const g = c.getContext('2d'); g.scale(Q, Q); fn(g, w, h);
      return { c, w, h };
    }
    function poly(g, pts) {
      g.beginPath(); g.moveTo(pts[0], pts[1]);
      for (let i = 2; i < pts.length; i += 2) g.lineTo(pts[i], pts[i + 1]);
      g.closePath();
    }
    function circ(g, x, y, r) { g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill(); }
    function blit(s, x, y, rot, sc, a) {
      if (sc === undefined) sc = 1;
      ctx.globalAlpha = a === undefined ? 1 : a;
      if (rot) {
        ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
        ctx.drawImage(s.c, -s.w * sc / 2, -s.h * sc / 2, s.w * sc, s.h * sc);
        ctx.restore();
      } else {
        ctx.drawImage(s.c, x - s.w * sc / 2, y - s.h * sc / 2, s.w * sc, s.h * sc);
      }
      ctx.globalAlpha = 1;
    }

    const GL = { cyan: '0,234,255', orange: '255,150,40', magenta: '255,60,190', green: '60,255,170', red: '255,50,80', yellow: '255,225,90', blue: '90,150,255', white: '255,255,255', purple: '160,90,255' };
    const G = {};
    Object.keys(GL).forEach(k => {
      G[k] = mk(64, 64, g => {
        const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
        gr.addColorStop(0, 'rgba(255,255,255,1)');
        gr.addColorStop(.18, 'rgba(' + GL[k] + ',.95)');
        gr.addColorStop(.5, 'rgba(' + GL[k] + ',.32)');
        gr.addColorStop(1, 'rgba(' + GL[k] + ',0)');
        g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
      });
    });

    const S = {};
    S.ship = mk(56, 64, g => {
      g.translate(28, 34);
      let gr = g.createLinearGradient(0, -28, 0, 22);
      gr.addColorStop(0, '#c8faff'); gr.addColorStop(.35, '#17b8ff'); gr.addColorStop(1, '#1b3a9a');
      g.fillStyle = gr;
      poly(g, [0, -28, 8, -8, 24, 10, 26, 22, 12, 16, 7, 22, -7, 22, -12, 16, -26, 22, -24, 10, -8, -8]);
      g.fill(); g.strokeStyle = 'rgba(190,250,255,.9)'; g.lineWidth = 1; g.stroke();
      g.fillStyle = '#0a2a66'; poly(g, [0, -20, 5, 14, -5, 14]); g.fill();
      gr = g.createRadialGradient(0, -8, 1, 0, -6, 9);
      gr.addColorStop(0, '#fff'); gr.addColorStop(.4, '#7fe9ff'); gr.addColorStop(1, '#0a6aa8');
      g.fillStyle = gr; g.beginPath(); g.ellipse(0, -6, 4.5, 8, 0, 0, TAU); g.fill();
      g.fillStyle = '#ff4d6d'; circ(g, -22, 14, 1.8); circ(g, 22, 14, 1.8);
      g.fillStyle = '#d6f6ff'; g.fillRect(-10, -2, 2.5, 10); g.fillRect(7.5, -2, 2.5, 10);
    });
    S.drone = mk(40, 40, g => {
      g.translate(20, 20);
      const gr = g.createRadialGradient(0, -3, 2, 0, 2, 18);
      gr.addColorStop(0, '#ffb3c0'); gr.addColorStop(.5, '#ff3355'); gr.addColorStop(1, '#7a0018');
      g.fillStyle = gr; g.beginPath(); g.ellipse(0, 3, 18, 10, 0, 0, TAU); g.fill();
      g.fillStyle = 'rgba(255,210,220,.9)'; g.beginPath(); g.ellipse(0, -1, 8.5, 8, 0, Math.PI, TAU); g.fill();
      g.fillStyle = '#2a0008'; circ(g, 0, -3, 3.2);
      g.fillStyle = '#ffe066'; circ(g, -11, 6, 1.8); circ(g, 0, 7.5, 1.8); circ(g, 11, 6, 1.8);
      g.strokeStyle = 'rgba(255,120,140,.8)'; g.lineWidth = 1; g.beginPath(); g.ellipse(0, 3, 18, 10, 0, 0, TAU); g.stroke();
    });
    S.zig = mk(40, 44, g => {
      g.translate(20, 22);
      const gr = g.createLinearGradient(0, -20, 0, 20);
      gr.addColorStop(0, '#e3b5ff'); gr.addColorStop(.5, '#9b3dff'); gr.addColorStop(1, '#3c0a8a');
      g.fillStyle = gr; poly(g, [0, 20, 17, -12, 8, -8, 0, -18, -8, -8, -17, -12]); g.fill();
      g.strokeStyle = 'rgba(230,190,255,.9)'; g.lineWidth = 1; g.stroke();
      g.fillStyle = '#fff'; g.beginPath(); g.ellipse(0, -2, 3, 5, 0, 0, TAU); g.fill();
    });
    S.tank = mk(68, 64, g => {
      g.translate(34, 32);
      const gr = g.createLinearGradient(0, -28, 0, 28);
      gr.addColorStop(0, '#ffd08a'); gr.addColorStop(.4, '#d9642a'); gr.addColorStop(1, '#5a1a0a');
      g.fillStyle = gr; poly(g, [-14, -26, 14, -26, 30, -8, 30, 10, 14, 26, -14, 26, -30, 10, -30, -8]); g.fill();
      g.strokeStyle = '#ffe0b0'; g.lineWidth = 1.2; g.stroke();
      g.fillStyle = '#2b0e06'; circ(g, 0, 0, 13);
      g.fillStyle = '#ff7a1a'; circ(g, 0, 0, 8);
      g.fillStyle = '#fff3c8'; circ(g, 0, 0, 3.5);
      g.fillStyle = '#3a1408'; g.fillRect(-4, 10, 8, 17);
      g.fillStyle = '#8a8a9a'; g.fillRect(-26, -4, 6, 14); g.fillRect(20, -4, 6, 14);
    });
    S.shooter = mk(52, 48, g => {
      g.translate(26, 24);
      const gr = g.createRadialGradient(0, -4, 2, 0, 0, 24);
      gr.addColorStop(0, '#c8ffe6'); gr.addColorStop(.5, '#18c27a'); gr.addColorStop(1, '#064a30');
      g.fillStyle = gr; g.beginPath(); g.ellipse(0, 0, 16, 14, 0, 0, TAU); g.fill();
      g.fillStyle = '#0b5a3c'; poly(g, [-14, -2, -25, 8, -21, 14, -12, 8]); g.fill(); poly(g, [14, -2, 25, 8, 21, 14, 12, 8]); g.fill();
      g.fillStyle = '#98ffd2'; g.fillRect(-24, 8, 3, 9); g.fillRect(21, 8, 3, 9);
      g.fillStyle = '#022'; g.beginPath(); g.ellipse(0, -1, 7, 5, 0, 0, TAU); g.fill();
      g.fillStyle = '#6dffb8'; circ(g, 0, -1, 2.5);
      g.strokeStyle = 'rgba(150,255,210,.8)'; g.lineWidth = 1; g.beginPath(); g.ellipse(0, 0, 16, 14, 0, 0, TAU); g.stroke();
    });
    S.kami = mk(34, 42, g => {
      g.translate(17, 21);
      const gr = g.createLinearGradient(0, -18, 0, 20);
      gr.addColorStop(0, '#fff2a8'); gr.addColorStop(.5, '#ff8a1f'); gr.addColorStop(1, '#a01800');
      g.fillStyle = gr; poly(g, [0, 20, 6, 6, 15, -2, 8, -6, 10, -18, 0, -10, -10, -18, -8, -6, -15, -2, -6, 6]); g.fill();
      g.strokeStyle = '#fff1c0'; g.lineWidth = 1; g.stroke();
      g.fillStyle = '#400'; circ(g, 0, 2, 4); g.fillStyle = '#ffe066'; circ(g, 0, 2, 1.8);
    });
    S.ast = [0, 1, 2].map(v => mk(56, 56, g => {
      g.translate(28, 28);
      const n = 9 + v, pts = [];
      for (let i = 0; i < n; i++) { const a = i / n * TAU, r = 17 + ((i * 37 + v * 53) % 9); pts.push(Math.cos(a) * r, Math.sin(a) * r); }
      const gr = g.createRadialGradient(-6, -6, 2, 0, 0, 25);
      gr.addColorStop(0, '#cdbca9'); gr.addColorStop(.6, '#7a6656'); gr.addColorStop(1, '#2e241d');
      g.fillStyle = gr; poly(g, pts); g.fill();
      g.strokeStyle = 'rgba(255,220,180,.5)'; g.lineWidth = 1; g.stroke();
      g.fillStyle = 'rgba(0,0,0,.28)';
      for (let i = 0; i < 4; i++) circ(g, ((i * 13 + v * 7) % 20) - 10, ((i * 17 + v * 11) % 20) - 10, 2 + i % 3);
    }));
    S.boss = mk(150, 120, g => {
      g.translate(75, 56);
      const gr = g.createLinearGradient(0, -50, 0, 56);
      gr.addColorStop(0, '#e6a8ff'); gr.addColorStop(.45, '#8a2be2'); gr.addColorStop(1, '#2a0a55');
      g.fillStyle = gr;
      poly(g, [0, 56, 30, 40, 70, 44, 72, 10, 56, -18, 30, -34, 14, -50, -14, -50, -30, -34, -56, -18, -72, 10, -70, 44, -30, 40]);
      g.fill(); g.strokeStyle = '#f0d0ff'; g.lineWidth = 1.5; g.stroke();
      g.fillStyle = 'rgba(20,0,40,.55)'; poly(g, [-40, -20, -16, -40, 16, -40, 40, -20, 28, 0, -28, 0]); g.fill();
      const cg = g.createRadialGradient(0, 8, 2, 0, 8, 22);
      cg.addColorStop(0, '#fff'); cg.addColorStop(.4, '#ff4dd2'); cg.addColorStop(1, 'rgba(255,0,150,0)');
      g.fillStyle = cg; circ(g, 0, 8, 22);
      g.fillStyle = '#d9b0ff'; [-52, -36, 36, 52].forEach(x => g.fillRect(x - 3, 32, 6, 20));
      g.fillStyle = '#ffef7a';
      g.beginPath(); g.ellipse(-18, -26, 6, 3, .4, 0, TAU); g.fill();
      g.beginPath(); g.ellipse(18, -26, 6, 3, -.4, 0, TAU); g.fill();
    });
    function pu(color, letter) {
      return mk(36, 36, g => {
        g.translate(18, 18);
        g.fillStyle = 'rgba(8,14,30,.88)'; circ(g, 0, 0, 13);
        g.strokeStyle = color; g.lineWidth = 2.4; g.beginPath(); g.arc(0, 0, 13, 0, TAU); g.stroke();
        g.fillStyle = color; g.font = 'bold 15px Arial,sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
        g.fillText(letter, 0, 1);
      });
    }
    S.pu = { rapid: pu('#3dffb0', 'R'), weapon: pu('#ffd23d', 'W'), shield: pu('#5aa0ff', 'S'), bomb: pu('#ff8a3d', 'B'), life: pu('#ff5fa2', '♥') };
    const PUG = { rapid: 'green', weapon: 'yellow', shield: 'blue', bomb: 'orange', life: 'magenta' };
    const PUT = { rapid: 'DISPARO RÁPIDO', weapon: 'ARMA +1', shield: 'ESCUDO', bomb: 'BOMBA +1', life: 'VIDA +1' };
    const PUC = { rapid: '#3dffb0', weapon: '#ffd23d', shield: '#7ab4ff', bomb: '#ff9a4d', life: '#ff7ab4' };
    S.pb = mk(10, 28, g => {
      const gr = g.createLinearGradient(0, 0, 0, 28);
      gr.addColorStop(0, '#fff'); gr.addColorStop(.35, '#7ff6ff'); gr.addColorStop(1, 'rgba(0,200,255,0)');

      if (p.dead || p.inv > 0) return false;
      if (p.shield > 0) { rings.push({ x: p.x, y: p.y, max: 50, t: .3, life: .3, c: '110,170,255' }); sfx.shield(); return false; }
      p.lives--; p.inv = 1.8; p.weapon = Math.max(1, p.weapon - 1); combo = 0; comboT = 0;
      shake = 14; flash = .4; vib(70); sfx.hurt(); boom(p.x, p.y, 18, .8, .8);
      if (p.lives <= 0) { p.dead = true; dyingT = 1.3; shake = 24; boom(p.x, p.y, 70, 1.3, 1.4); sfx.big(); vib([120, 60, 200]); }
      return true;
    }
    function collect(u) {
      switch (u.type) {
        case 'rapid': p.rapidT = 9; break;
        case 'weapon': if (p.weapon < 3) p.weapon++; else { score += 100; popup(u.x, u.y - 14, '+100', '#ffd23d'); } break;
        case 'shield': p.shield = 7; break;
        case 'bomb': if (p.bombs < 3) p.bombs++; else { score += 100; popup(u.x, u.y - 14, '+100', '#ffd23d'); } break;
        case 'life': if (p.lives < 5) p.lives++; else { score += 200; popup(u.x, u.y - 14, '+200', '#ffd23d'); } break;
      }
      popup(u.x, u.y - 12, PUT[u.type], PUC[u.type]);
      rings.push({ x: u.x, y: u.y, max: 40, t: .35, life: .35, c: GL[PUG[u.type]] });
      sfx.power();
    }
    function bomb() {
      if (state !== 'playing' || p.dead || p.bombs <= 0) return;
      p.bombs--; sfx.bomb(); shake = 20; flash = .6; vib(120);
      rings.push({ x: p.x, y: p.y, max: Math.max(W, H), t: .7, life: .7, c: '255,170,60' });
      ebullets.length = 0;
      for (const e of enemies) { if (e.dead || e.y < -10) continue; if (e.type === 'boss') hitEnemy(e, 20, e.x, e.y); else killEnemy(e, false); }
    }

    // =====================================================================
    //  UPDATE
    // =====================================================================
    function update(rawDt) {
      let dt = rawDt;
      if (slowT > 0) { slowT -= rawDt; dt *= .35; }
      updateBg(dt);
      if (!p.dead) {
        gameT += dt;
        const kx = (keys.arrowright || keys.d ? 1 : 0) - (keys.arrowleft || keys.a ? 1 : 0);
        const ky = (keys.arrowdown || keys.s ? 1 : 0) - (keys.arrowup || keys.w ? 1 : 0);
        if (kx || ky) { p.x += kx * 330 * dt; p.y += ky * 330 * dt; p.tx = p.x; p.ty = p.y; }
        else { const f = 1 - Math.exp(-20 * dt); p.x += (p.tx - p.x) * f; p.y += (p.ty - p.y) * f; }
        p.x = clamp(p.x, 24, W - 24); p.y = clamp(p.y, H * .3, H - 36);
        const tt = kx ? kx * .28 : clamp((p.tx - p.x) * .012, -.3, .3);
        p.tilt += (tt - p.tilt) * Math.min(1, 10 * dt);
        p.shootT -= dt;
        if (p.shootT <= 0) { fire(); p.shootT = p.rapidT > 0 ? .095 : .17; }
        if (p.inv > 0) p.inv -= dt; if (p.shield > 0) p.shield -= dt; if (p.rapidT > 0) p.rapidT -= dt;
        if (parts.length < partMax * .8 && Math.random() < .7) parts.push({ x: p.x + rnd(-8, 8), y: p.y + 24, vx: rnd(-12, 12), vy: rnd(120, 200), t: .3, max: .3, g: G.cyan, s: .22 });
        spawnTick(dt);
        if (bossT > 0) { bossT -= dt; if (bossT <= 0) spawnBoss(); }
        if (nextLevelT > 0) { nextLevelT -= dt; if (nextLevelT <= 0) nextLevel(); }
      } else {
        dyingT -= rawDt; if (dyingT <= 0) { finish(); return; }
      }
      if (comboT > 0) { comboT -= dt; if (comboT <= 0) combo = 0; }
      if (banner.t > 0) banner.t -= dt;
      if (shake > 0) shake = Math.max(0, shake - 50 * dt);
      if (flash > 0) flash = Math.max(0, flash - dt * 1.5);

      for (const b of bullets) { b.x += b.vx * dt; b.y += b.vy * dt; if (b.y < -30 || b.x < -20 || b.x > W + 20) b.dead = true; }
      for (const b of ebullets) { b.x += b.vx * dt; b.y += b.vy * dt; if (b.y > H + 20 || b.y < -30 || b.x < -20 || b.x > W + 20) b.dead = true; }
      for (const e of enemies) { updEnemy(e, dt); if (e.type !== 'boss' && (e.y > H + 70 || e.x < -90 || e.x > W + 90 || e.y < -150)) e.dead = true; }

      // balas del jugador vs enemigos
      for (const b of bullets) {
        if (b.dead) continue;
        for (const e of enemies) {
          if (e.dead || e.y < -10) continue;
          const dx = b.x - e.x, dy = b.y - e.y, rr = e.r + 4;
          if (dx * dx + dy * dy < rr * rr) { b.dead = true; hitEnemy(e, 1, b.x, b.y); break; }
        }
      }
      if (!p.dead) {
        // enemigos vs jugador
        for (const e of enemies) {
          if (e.dead) continue;
          const dx = p.x - e.x, dy = p.y - e.y, rr = e.r + 10;
          if (dx * dx + dy * dy < rr * rr) {
            if (e.type === 'boss') hurt();
            else if (p.inv > 0 || p.shield > 0) killEnemy(e, false);
            else { killEnemy(e, true); hurt(); }
          }
        }
        // balas enemigas vs jugador
        for (const b of ebullets) {
          if (b.dead) continue;
          const dx = p.x - b.x, dy = p.y - b.y;
          if (dx * dx + dy * dy < 13 * 13) { b.dead = true; hurt(); }
        }
        // power-ups (con imán)
        for (const u of powers) {
          u.age += dt; u.y += 75 * dt;
          const dx = p.x - u.x, dy = p.y - u.y, d2 = dx * dx + dy * dy;
          if (d2 < 130 * 130) { const d = Math.sqrt(d2) || 1; u.x += dx / d * 140 * dt; u.y += dy / d * 140 * dt; }
          if (d2 < 26 * 26) { collect(u); u.dead = true; }
          if (u.y > H + 30) u.dead = true;
        }
      }
      sweep(bullets, notDead); sweep(ebullets, notDead); sweep(enemies, notDead); sweep(powers, notDead);
      updateFx(dt);
      hud();
    }
    function finish() {
      if (state !== 'playing') return;
      state = 'over';
      if (score > highScore) { highScore = score; store.set('galaxyHigh2', String(highScore)); }
      $('oScore').textContent = score; $('oHigh').textContent = highScore; $('oTime').textContent = fmt(gameT);
      $('oLevel').textContent = level; $('oKills').textContent = totalKills; $('oCombo').textContent = maxCombo;
      $('newRec').classList.toggle('hide', !(score > prevHigh && score > 0));
      Snd.stopMusic(); sfx.over();
      hudEl.classList.add('hide'); showPanel('overPanel');
    }

    // =====================================================================
    //  DIBUJO
    // =====================================================================
    function txt(s, x, y, size, color, align, alpha, stroke) {
      ctx.globalAlpha = alpha === undefined ? 1 : alpha;
      ctx.font = '700 ' + size + 'px ' + FONT; ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
      if (stroke) { ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.65)'; ctx.strokeText(s, x, y); }
      ctx.fillStyle = color; ctx.fillText(s, x, y); ctx.globalAlpha = 1;
    }
    function drawBg() {
      for (const n of neb) blit(n.g, n.x, n.y, 0, n.s, n.a);
      ctx.fillStyle = '#fff';
      for (let l = 0; l < 3; l++) {
        ctx.globalAlpha = .35 + l * .25; const sz = .8 + l * .6, a = stars[l];
        for (let i = 0; i < a.length; i++) ctx.fillRect(a[i].x, a[i].y, sz, sz);
      }
      ctx.globalAlpha = 1;
    }
    function drawPlayer(x, y, tilt, blink) {
      if (blink) return;
      ctx.globalCompositeOperation = 'lighter';
      const fl = .75 + Math.random() * .5;
      blit(G.cyan, x - 9, y + 27, 0, .45 * fl, .9); blit(G.cyan, x + 9, y + 27, 0, .45 * fl, .9); blit(G.blue, x, y + 36, 0, .7 * fl, .5);
      ctx.globalCompositeOperation = 'source-over';
      blit(S.ship, x, y, tilt, 1);
    }
    function draw() {
      const kx = canvas.width / W, ky = canvas.height / H;
      let ox = 0, oy = 0; if (shake > 0) { ox = (Math.random() - .5) * shake; oy = (Math.random() - .5) * shake; }
      ctx.setTransform(kx, 0, 0, ky, ox * kx, oy * ky);
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = bgGrad; ctx.fillRect(-20, -20, W + 40, H + 40);
      drawBg();
      if (state === 'menu') { drawPlayer(W / 2, H * .8 + Math.sin(performance.now() / 500) * 6, 0, false); return; }

      const t = performance.now() / 1000;
      // power-ups
      for (const u of powers) {
        ctx.globalCompositeOperation = 'lighter'; blit(G[PUG[u.type]], u.x, u.y, 0, 1.1, .5); ctx.globalCompositeOperation = 'source-over';
        blit(S.pu[u.type], u.x, u.y, 0, 1 + Math.sin(u.age * 6) * .07);
      }
      // enemigos
      for (const e of enemies) {
        ctx.globalCompositeOperation = 'lighter'; blit(G[e.glow], e.x, e.y, 0, e.gs, .4); ctx.globalCompositeOperation = 'source-over';
        const rot = e.type === 'zig' ? Math.cos(e.age * e.freq + e.ph) * .35 : e.type === 'ast' ? e.rot : e.type === 'kami' ? e.ang - Math.PI / 2 : 0;
        blit(e.spr, e.x, e.y, rot, e.sc || 1);
        if (e.hit > 0) { ctx.globalCompositeOperation = 'lighter'; blit(e.spr, e.x, e.y, rot, e.sc || 1, .7); ctx.globalCompositeOperation = 'source-over'; }
      }
      // balas enemigas y propias
      ctx.globalCompositeOperation = 'lighter';
      for (const b of ebullets) blit(G.red, b.x, b.y, 0, .45, .6);
      ctx.globalCompositeOperation = 'source-over';
      for (const b of ebullets) blit(S.eb, b.x, b.y, 0, 1);
      const glowB = bullets.length < 60;
      for (const b of bullets) {
        if (glowB) { ctx.globalCompositeOperation = 'lighter'; blit(G.cyan, b.x, b.y, 0, .5, .5); ctx.globalCompositeOperation = 'source-over'; }
        blit(S.pb, b.x, b.y, b.vx ? Math.atan2(b.vx, -b.vy) : 0, 1);
      }
      // jugador
      if (!p.dead) {
        drawPlayer(p.x, p.y, p.tilt, p.inv > 0 && p.shield <= 0 && ((gameT * 14) | 0) % 2 === 0);
        if (p.shield > 0) {
          const a = p.shield < 1.5 ? (((t * 12) | 0) % 2 ? .25 : .8) : .8;
          ctx.globalCompositeOperation = 'lighter'; blit(G.blue, p.x, p.y, 0, 1.5, a * .45); ctx.globalCompositeOperation = 'source-over';
          ctx.globalAlpha = a; ctx.strokeStyle = '#7ab4ff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(p.x, p.y, 32 + Math.sin(t * 8) * 1.5, 0, TAU); ctx.stroke(); ctx.globalAlpha = 1;
        }
      }
      // partículas y ondas
      ctx.globalCompositeOperation = 'lighter';
      for (const q of parts) { const k = q.t / q.max; blit(q.g, q.x, q.y, 0, q.s * (.4 + k), k); }
      for (const r of rings) {
        const k = 1 - r.t / r.life, rad = 6 + (r.max - 6) * k;
        ctx.strokeStyle = 'rgba(' + r.c + ',' + (1 - k) + ')'; ctx.lineWidth = 3 * (1 - k) + 1;
        ctx.beginPath(); ctx.arc(r.x, r.y, rad, 0, TAU); ctx.stroke();
      }
      ctx.globalCompositeOperation = 'source-over';
      for (const q of pops) txt(q.text, q.x, q.y, 12, q.col, 'center', Math.min(1, q.t / .4), true);

      // barra del jefe
      for (const e of enemies) {
        if (e.type !== 'boss') continue;
        const bw = W - 80, f = clamp(e.hp / e.max, 0, 1);
        ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(40, 56, bw, 9);
        const g = ctx.createLinearGradient(40, 0, 40 + bw, 0); g.addColorStop(0, '#ff2fb0'); g.addColorStop(1, '#ffd23d');
        ctx.fillStyle = g; ctx.fillRect(41, 57, (bw - 2) * f, 7);
        txt('JEFE', W / 2, 75, 10, '#ffd0f0', 'center', .9);
      }
      // combo y mejoras activas
      if (!p.dead) {
        let y = 70;
        if (p.rapidT > 0) { txt('RÁPIDO ' + Math.ceil(p.rapidT) + 's', 10, y, 10, '#3dffb0', 'left', .9); y += 14; }
        if (p.shield > 0) { txt('ESCUDO ' + Math.ceil(p.shield) + 's', 10, y, 10, '#7ab4ff', 'left', .9); y += 14; }
        if (p.weapon > 1) txt('ARMA NV ' + p.weapon, 10, y, 10, '#ffd23d', 'left', .9);
        if (combo >= 3) {
          const m = Math.min(5, 1 + Math.floor(combo / 6));
          txt('COMBO ×' + combo + (m > 1 ? ' · x' + m + ' pts' : ''), W / 2, 98, 12, '#ffd23d', 'center', 1, true);
          ctx.fillStyle = 'rgba(255,210,60,.85)'; ctx.fillRect(W / 2 - 40, 108, 80 * clamp(comboT / 2.4, 0, 1), 3);
        }
      }
      // banner
      if (banner.t > 0) {
        const a = clamp(Math.min(banner.dur - banner.t, banner.t) * 3, 0, 1);
        txt(banner.text, W / 2, H * .36, 32, '#ffffff', 'center', a, true);
        if (banner.sub) txt(banner.sub, W / 2, H * .36 + 34, 12, '#9fefff', 'center', a, true);
      }
      if (flash > 0) { ctx.fillStyle = 'rgba(255,80,90,' + (flash * .5) + ')'; ctx.fillRect(-20, -20, W + 40, H + 40); }
    }

    // =====================================================================
    //  PANTALLAS / FLUJO
    // =====================================================================
    function showPanel(id) {
      ['menu', 'pausePanel', 'overPanel'].forEach(x => $(x).classList.toggle('hide', x !== id));
    }
    let wl = null;
    function lockScreen() {
      try { if (navigator.wakeLock && !wl) navigator.wakeLock.request('screen').then(l => { wl = l; l.addEventListener('release', () => { wl = null; }); }).catch(() => {}); } catch (e) {}
    }
    function startGame() {
      Snd.init(); Snd.resume();
      resetGame(); state = 'playing'; activePtr = null;
      showPanel(null); hudEl.classList.remove('hide');
      Snd.stopMusic(); Snd.startMusic(); lockScreen();
    }
    function toMenu() {
      state = 'menu'; activePtr = null; Snd.stopMusic();
      resetGame(); hudEl.classList.add('hide');
      $('menuHigh').textContent = highScore; showPanel('menu');
    }
    function pause() {
      if (state !== 'playing') return;
      state = 'paused'; activePtr = null; Snd.stopMusic();
      if (score > highScore) { highScore = score; store.set('galaxyHigh2', String(highScore)); }
      showPanel('pausePanel');
    }
    function resume() {
      if (state !== 'paused') return;
      state = 'playing'; showPanel(null); Snd.resume(); Snd.startMusic();
    }

    // =====================================================================
    //  ENTRADA (táctil, mouse y teclado)
    // =====================================================================
    function setTarget(e) {
      const r = canvas.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;
      const off = e.pointerType === 'mouse' ? 0 : Math.min(70, H * .1);   // en táctil la nave va por encima del dedo
      p.tx = clamp(x, 24, W - 24); p.ty = clamp(y - off, H * .3, H - 36);
    }
    wrap.addEventListener('pointerdown', e => {
      if (state !== 'playing' || (e.target.closest && e.target.closest('button'))) return;
      Snd.resume();
      if (e.pointerType !== 'mouse') {
        if (activePtr !== null && e.pointerId !== activePtr) { bomb(); return; }   // segundo dedo = bomba
        activePtr = e.pointerId;
        try { wrap.setPointerCapture(e.pointerId); } catch (_) {}
      }
      setTarget(e);
    });
    wrap.addEventListener('pointermove', e => {
      if (state !== 'playing') return;
      if (e.pointerType === 'mouse' || e.pointerId === activePtr) setTarget(e);
    });
    const endPtr = e => { if (e.pointerId === activePtr) activePtr = null; };
    wrap.addEventListener('pointerup', endPtr);
    wrap.addEventListener('pointercancel', endPtr);
    wrap.addEventListener('lostpointercapture', endPtr);
    wrap.addEventListener('contextmenu', e => { e.preventDefault(); if (e.button === 2) bomb(); });
    document.addEventListener('touchmove', e => { e.preventDefault(); }, { passive: false });
    document.addEventListener('gesturestart', e => { e.preventDefault(); });

    window.addEventListener('keydown', e => {
      const k = (e.key || '').toLowerCase();
      keys[k] = true;
      if (['arrowleft', 'arrowright', 'arrowup', 'arrowdown', ' '].indexOf(k) >= 0) e.preventDefault();
      if (k === 'p' || k === 'escape' || k === ' ') { if (state === 'playing') pause(); else if (state === 'paused') resume(); }
      else if (k === 'b' || k === 'shift') bomb();
      else if (k === 'enter') { if (state === 'menu' || state === 'over') startGame(); else if (state === 'paused') resume(); }
    });
    window.addEventListener('keyup', e => { keys[(e.key || '').toLowerCase()] = false; });
    window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (state === 'playing') pause(); });
    document.addEventListener('visibilitychange', () => { if (document.hidden) { if (state === 'playing') pause(); } else lockScreen(); });

    $('playBtn').addEventListener('click', startGame);
    $('againBtn').addEventListener('click', startGame);
    $('restartBtn').addEventListener('click', startGame);
    $('resumeBtn').addEventListener('click', resume);
    $('menuBtn').addEventListener('click', toMenu);
    $('menuBtn2').addEventListener('click', toMenu);
    $('bombBtn').addEventListener('click', bomb);
    $('pauseBtn').addEventListener('click', () => { if (state === 'playing') pause(); else if (state === 'paused') resume(); });
    $('soundBtn').addEventListener('click', toggleSound);
    $('menuSound').addEventListener('click', toggleSound);
    const fsBtn = $('fsBtn'), de = document.documentElement;
    if (!(de.requestFullscreen || de.webkitRequestFullscreen)) fsBtn.style.display = 'none';
    fsBtn.addEventListener('click', () => {
      try {
        const d = document;
        if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
        else { const r = (de.requestFullscreen || de.webkitRequestFullscreen).call(de); if (r && r.catch) r.catch(() => {}); }
      } catch (e) {}
    });

    // =====================================================================
    //  BUCLE PRINCIPAL (delta-time: igual de fluido a 30, 60, 120 o 144 Hz)
    // =====================================================================
    let last = 0, fAcc = 0, fN = 0;
    function frame(ts) {
      requestAnimationFrame(frame);
      if (!last) last = ts;
      const raw = (ts - last) / 1000; last = ts;
      const dt = Math.min(Math.max(raw, 0), .05);
      if (state === 'playing') {
        update(dt);
        // calidad adaptativa: si el dispositivo va lento, baja resolución y partículas
        if (!lowQ && raw < .5) { fAcc += raw; if (++fN >= 90) { if (fAcc / fN > .027) { lowQ = true; partMax = 140; resize(); } fAcc = 0; fN = 0; } }
      } else if (state !== 'paused') { updateBg(dt); updateFx(dt); }
      draw();
    }

    // =====================================================================
    //  ARRANQUE
    // =====================================================================
    $('help').innerHTML = isTouch
      ? '👆 <b>Arrastra</b> para mover · la nave dispara sola<br>✌️ <b>Toca con otro dedo</b> o el botón 💣 = bomba<br><b>R</b> rápido · <b>W</b> arma · <b>S</b> escudo · <b>B</b> bomba · <b>♥</b> vida'
      : '🖱️ <b>Mouse</b> o <b>flechas / WASD</b> para mover<br><b>B</b> o clic derecho = bomba · <b>P / Espacio</b> = pausa<br><b>R</b> rápido · <b>W</b> arma · <b>S</b> escudo · <b>B</b> bomba · <b>♥</b> vida';
    resize();
    resetGame();
    setSoundUI();
    $('menuHigh').textContent = highScore;
    showPanel('menu');
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
