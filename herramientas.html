<style>
:root{
    --bg:#000;
    --border:rgba(0,140,255,.26);
    --text:#fff;
    --muted:rgba(255,255,255,.72);
    --section:#3da5ff;
    --accent:#008cff;
}
*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body{ min-height:100%; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; overflow-x:hidden; }
body{ display:flex; justify-content:center; position:relative; }
#stars{ position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none;
    background:radial-gradient(ellipse at 50% 100%, #0b1230 0%, #05060f 45%, #000 80%); }
.page{ width:100%; display:flex; justify-content:center; padding:22px 14px 40px; position:relative; z-index:1; }
.stack{ width:100%; max-width:340px; }
.title{ font-size:22px; font-weight:800; letter-spacing:5px; text-align:center; padding:8px 0 4px;
    background:linear-gradient(90deg,#fff,#7cc4ff 50%,#fff); -webkit-background-clip:text; background-clip:text;
    color:transparent; animation:rise .6s ease both; }
.title::after{ content:""; display:block; width:46px; height:3px; border-radius:3px; margin:10px auto 0;
    background:linear-gradient(90deg,transparent,var(--accent),transparent); box-shadow:0 0 12px var(--accent); }
.text{ font-size:13px; line-height:1.5; color:var(--muted); text-align:center; padding:8px 4px 10px; animation:rise .6s .08s ease both; }
.links{ width:100%; display:flex; flex-direction:column; align-items:stretch; gap:8px; }
.section-title{ display:flex; align-items:center; gap:10px; font-size:11px; font-weight:700; letter-spacing:1.4px;
    color:var(--section); text-transform:uppercase; margin:18px 0 4px; padding-left:2px; }
.section-title::after{ content:""; flex:1; height:1px; background:linear-gradient(90deg,rgba(0,140,255,.4),transparent); }
.btn{ width:100%; display:flex; align-items:center; gap:12px; padding:11px 14px; border-radius:14px;
    text-decoration:none; color:var(--text);
    background:linear-gradient(180deg,rgba(18,22,40,.72),rgba(6,8,18,.78));
    border:1px solid var(--border);
    box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 6px 16px rgba(0,0,0,.35);
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease;
    animation:rise .5s ease both; animation-delay:calc(var(--n,0)*35ms + .12s); position:relative; }
.btn::after{ content:"›"; margin-left:auto; font-size:20px; line-height:1; color:rgba(255,255,255,.35); transition:transform .15s,color .15s; }
.btn:hover{ transform:translateY(-1px); border-color:rgba(0,140,255,.6); box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 8px 22px rgba(0,110,255,.22); }
.btn:hover::after{ transform:translateX(3px); color:var(--section); }
.btn:active{ transform:scale(.98); }
.btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
.icon{ width:24px; height:24px; flex:0 0 24px; display:block; object-fit:contain; border-radius:6px; }
.icon-flower{ width:24px; height:24px; flex:0 0 24px; display:flex; align-items:center; justify-content:center; font-size:19px; line-height:1; }
.label{ font-size:14.5px; font-weight:600; line-height:1.1; }
@keyframes rise{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:none; } }
@media (prefers-reduced-motion:reduce){ *{ animation:none !important; transition:none !important; } }
</style>

<script>
const canvas = document.getElementById("stars");
const ctx = canvas.getContext("2d");

let stars = [];
let w, h;

function resize(){
    w = window.innerWidth; h = window.innerHeight;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = w * dpr; canvas.height = h * dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    createStars();
}

function createStars(){
    const count = Math.min(220, Math.floor((w * h) / 5500));
    stars = [];
    for(let i = 0; i < count; i++){
        stars.push({
            x: Math.random() * w,
            y: Math.random() * h,
            r: Math.random() * 1.4 + 0.3,
            speed: Math.random() * 0.35 + 0.08,
            alpha: Math.random() * 0.6 + 0.25,
            twinkle: Math.random() * Math.PI * 2
        });
    }
}

function draw(){
    ctx.clearRect(0, 0, w, h);

    for(const s of stars){
        s.y += s.speed;
        s.twinkle += 0.02;

        if(s.y > h){
            s.y = 0;
            s.x = Math.random() * w;
        }

        const glow = 0.35 + Math.sin(s.twinkle) * 0.25;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(200, 220, 255, ${s.alpha * glow})`;
        ctx.fill();
    }

    if(!document.hidden) raf = requestAnimationFrame(draw);
}
let raf;
document.addEventListener("visibilitychange", () => { if(!document.hidden){ cancelAnimationFrame(raf); draw(); } });

window.addEventListener("resize", resize);
resize();
draw();
</script>
