<!DOCTYPE html>
<html lang="es" data-theme="marfil">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Dados 3D · Sxgura Inc</title>
<style>
:root{--bg:#000;--card:#1c1c1e;--card2:#2c2c2e;--muted:#8e8e93;--acc:#0a84ff;--good:#30d158;--warn:#ff9f0a;
--mid:#e0e0e6;--f1:#f6f6f8;--f2:#cfcfd6;--pip1:#3a3a3c;--pip2:#0c0c0e;--edge:rgba(0,0,0,.12);--glow:none}
html[data-theme=rojo]{--mid:#c42d2d;--f1:#ef4a4a;--f2:#a31616;--pip1:#fff;--pip2:#e9e9ee;--edge:rgba(0,0,0,.25)}
html[data-theme=negro]{--mid:#222228;--f1:#3b3b42;--f2:#0f0f12;--pip1:#fff;--pip2:#d8d8de;--edge:rgba(255,255,255,.12)}
html[data-theme=neon]{--mid:#0e1730;--f1:#13203d;--f2:#070d1f;--pip1:#7ffff0;--pip2:#19d3c2;--edge:rgba(0,255,230,.45);--glow:0 0 8px #22e8d4}
html[data-theme=azul]{--mid:#3a74de;--f1:#5aa2ff;--f2:#1747b8;--pip1:#fff;--pip2:#e6eeff;--edge:rgba(0,0,0,.22)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{min-height:100dvh;background:radial-gradient(900px 500px at 50% -10%,#10131c,#000 60%) fixed;color:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;display:flex;justify-content:center;padding:calc(16px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
.app{width:min(100%,440px)}
.header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.icon-ios{width:44px;height:44px;border-radius:12px;background:linear-gradient(180deg,#5ac8fa,#007aff);display:grid;place-items:center;box-shadow:0 8px 20px rgba(0,122,255,.35);flex:none}
.icon-ios svg{width:26px;height:26px}
h1{font-size:22px;font-weight:700;line-height:1.1}
.sub{font-size:12px;color:var(--muted);margin-top:2px}
.lang{margin-left:auto;min-width:44px;height:36px;padding:0 12px;border-radius:12px;background:var(--card);border:1px solid #2c2c2e;font-size:12px;font-weight:800;letter-spacing:.5px}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px}
.card>label,.lbl{display:block;font-size:12px;color:var(--muted);margin-bottom:10px;font-weight:600}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mode{border-radius:12px;padding:12px 4px;background:var(--card2);color:#fff;font-size:14px;font-weight:600;transition:background .15s,transform .1s}
.mode:active{transform:scale(.97)}.mode.active{background:var(--acc)}
.mode:disabled{opacity:.5}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:var(--card2);font-size:13px;font-weight:600;border:2px solid transparent}
.chip i{width:16px;height:16px;border-radius:5px;display:block;background:linear-gradient(145deg,var(--c1),var(--c2));box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.chip.on{border-color:var(--acc);background:#16263f}
/* escenario 3D */
.stage{background:#1c1c1e;border-radius:18px;padding:16px 12px 18px;display:flex;flex-direction:column;align-items:center;margin-bottom:12px;overflow:hidden}
.table{position:relative;width:100%;border-radius:16px;padding:20px 8px 14px;background:radial-gradient(120% 90% at 50% 20%,#1d7a55 0%,#0f4a35 55%,#08281d 100%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.06),inset 0 10px 30px rgba(0,0,0,.45);cursor:pointer;user-select:none;-webkit-user-select:none}
.scene{--s:min(116px,31vw);display:flex;gap:calc(var(--s)*.4);justify-content:center;align-items:flex-end;height:calc(var(--s)*2.05);perspective:900px;perspective-origin:50% 35%;padding-bottom:12px}
.scene.c2{--s:min(92px,22vw);gap:calc(var(--s)*.8)}.scene.c3{--s:min(62px,16vw);gap:calc(var(--s)*.9)}
.dw{position:relative;width:var(--s);height:var(--s);transform-style:preserve-3d;will-change:transform}
.dw.hide{display:none}
.shadow{position:absolute;left:8%;right:8%;bottom:-14%;height:calc(var(--s)*.22);border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.6),transparent);pointer-events:none}
.die{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
.slab{position:absolute;inset:0;border-radius:calc(var(--s)*.12);background:var(--mid)}
.face{position:absolute;inset:0;border-radius:calc(var(--s)*.12);display:grid;place-items:center;background:linear-gradient(145deg,var(--f1),var(--f2));box-shadow:inset 0 0 0 1.5px var(--edge),inset 0 2px 0 rgba(255,255,255,.3),inset 0 -6px 14px rgba(0,0,0,.16);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.grid{width:70%;height:70%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);place-items:center}
.pip{width:calc(var(--s)*.15);height:calc(var(--s)*.15);border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--pip1),var(--pip2));box-shadow:0 1px 2px rgba(0,0,0,.4),var(--glow)}
.f1{transform:rotateY(0deg) translateZ(calc(var(--s)/2))}
.f2{transform:rotateY(90deg) translateZ(calc(var(--s)/2))}
.f3{transform:rotateX(90deg) translateZ(calc(var(--s)/2))}
.f4{transform:rotateX(-90deg) translateZ(calc(var(--s)/2))}
.f5{transform:rotateY(-90deg) translateZ(calc(var(--s)/2))}
.f6{transform:rotateY(180deg) translateZ(calc(var(--s)/2))}
.scene,.scene *{pointer-events:none}
.hint{margin-top:10px;font-size:11.5px;color:var(--muted);text-align:center}
.result{margin-top:14px;text-align:center;font-size:22px;font-weight:800;min-height:32px;letter-spacing:-.2px}
.result.win{color:var(--good)}.result small{display:block;font-size:12.5px;color:var(--warn);font-weight:700;margin-top:2px;letter-spacing:.2px}
button.main{margin-top:14px;border-radius:14px;padding:15px 28px;min-width:200px;background:var(--acc);color:#fff;font-size:17px;font-weight:800;box-shadow:0 8px 22px rgba(10,132,255,.35);transition:transform .1s,opacity .2s}
button.main:active{transform:scale(.97)}button.main:disabled{opacity:.55}
/* historial */
.hist{display:flex;gap:6px;flex-wrap:wrap;min-height:30px;align-items:center}
.hist .h{padding:5px 10px;border-radius:9px;background:var(--card2);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.hist .h:first-child{background:#16263f;color:#7cc0ff}
.hist .none{color:var(--muted);font-size:13px}
.row2{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.row2 .lbl{margin:0}.link{color:var(--acc);font-size:12px;font-weight:700}
.stats{display:flex;gap:8px;margin-top:10px}
.stats div{flex:1;background:#111113;border-radius:12px;padding:9px;text-align:center}
.stats b{display:block;font-size:18px;font-variant-numeric:tabular-nums}.stats span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
/* ajustes */
.set{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #2c2c2e;font-size:14px;font-weight:600}
.set:last-child{border:0}.set span{flex:1}
.sw{width:48px;height:28px;border-radius:99px;background:#3a3a3c;position:relative;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.sw[aria-pressed=true]{background:var(--good)}.sw[aria-pressed=true]::after{transform:translateX(20px)}
input[type=range]{width:150px;accent-color:var(--acc);height:28px}input[type=range]:disabled{opacity:.35}
.foot{text-align:center;color:#5d6b7c;font-size:11px;letter-spacing:1.5px;margin-top:6px}
@media(prefers-reduced-motion:reduce){.dw,.die{transition:none}}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="icon-ios">
      <svg viewBox="0 0 24 24" fill="none"><rect x="3.5" y="3.5" width="17" height="17" rx="4" stroke="#fff" stroke-width="1.8"/><circle cx="8.5" cy="8.5" r="1.3" fill="#fff"/><circle cx="12" cy="12" r="1.3" fill="#fff"/><circle cx="15.5" cy="15.5" r="1.3" fill="#fff"/></svg>
    </div>
    <div><h1 data-i="title">Dados 3D</h1><div class="sub" data-i="sub">1 a 3 dados</div></div>
    <button class="lang" id="bLang" aria-label="Idioma">ES</button>
  </div>

  <div class="card">
    <label data-i="howmany">Elige cuántos dados</label>
    <div class="modes" id="modes">
      <button class="mode active" type="button" data-n="1"></button>
      <button class="mode" type="button" data-n="2"></button>
      <button class="mode" type="button" data-n="3"></button>
    </div>
  </div>

  <div class="stage">
    <div class="table" id="table">
      <div class="scene" id="scene"></div>
    </div>
    <div class="hint" data-i="hint">Toca la mesa o el botón para tirar</div>
    <div class="result" id="result"></div>
    <button class="main" id="rollBtn" type="button" data-i="roll">Tirar</button>
  </div>

  <div class="card">
    <div class="row2"><span class="lbl" data-i="history" style="margin:0">Historial</span><button class="link" id="bClear" data-i="clear">Limpiar</button></div>
    <div class="hist" id="hist"></div>
    <div class="stats"><div><b id="sRolls">0</b><span data-i="rolls">Tiradas</span></div><div><b id="sAvg">0</b><span data-i="avg">Promedio</span></div><div><b id="sMax">0</b><span data-i="best">Mayor</span></div></div>
  </div>

  <div class="card">
    <span class="lbl" data-i="style">Estilo del dado</span>
    <div class="chips" id="themes"></div>
  </div>

  <div class="card">
    <div class="set"><span data-i="sound">Sonido</span><button class="sw" id="swSnd" aria-label="Sonido"></button></div>
    <div class="set"><span data-i="volume">Volumen</span><input type="range" id="rgVol" min="0" max="100" aria-label="Volumen"></div>
    <div class="set"><span data-i="vibe">Vibración</span><button class="sw" id="swVib" aria-label="Vibración"></button></div>
  </div>
  <div class="foot">DADOS 3D · BY SXGURA INC.</div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  const S = Object.assign({ count: 1, theme: 'marfil', sound: true, vol: .8, vib: true, lang: 'es' }, store.get('sx_dados_v2', {}));
  const ST = Object.assign({ rolls: 0, sum: 0, max: 0, hist: [] }, store.get('sx_dados_v2_st', {}));
  const save = () => { store.set('sx_dados_v2', S); store.set('sx_dados_v2_st', ST); };

  /* ---------- idioma ---------- */
  const TX = {
    es: { title: 'Dados 3D', sub: '1 a 3 dados', howmany: 'Elige cuántos dados', hint: 'Toca la mesa o el botón para tirar', roll: 'Tirar', rolling: 'Tirando…', ready: 'Listo', history: 'Historial', clear: 'Limpiar', rolls: 'Tiradas', avg: 'Promedio', best: 'Mayor', style: 'Estilo del dado', sound: 'Sonido', volume: 'Volumen', vibe: 'Vibración', one: '1 dado', two: '2 dados', three: '3 dados', came: 'Salió: ', doubles: '¡Dobles!', triples: '¡Triples!', none: 'Sin tiradas aún', marfil: 'Marfil', rojo: 'Rojo', negro: 'Negro', neon: 'Neón', azul: 'Azul' },
    en: { title: '3D Dice', sub: '1 to 3 dice', howmany: 'Choose how many dice', hint: 'Tap the table or the button to roll', roll: 'Roll', rolling: 'Rolling…', ready: 'Ready', history: 'History', clear: 'Clear', rolls: 'Rolls', avg: 'Average', best: 'Highest', style: 'Dice style', sound: 'Sound', volume: 'Volume', vibe: 'Vibration', one: '1 die', two: '2 dice', three: '3 dice', came: 'Rolled: ', doubles: 'Doubles!', triples: 'Triples!', none: 'No rolls yet', marfil: 'Ivory', rojo: 'Red', negro: 'Black', neon: 'Neon', azul: 'Blue' }
  };
  const t = k => TX[S.lang][k];
  function applyLang() {
    document.documentElement.lang = S.lang;
    document.title = t('title') + ' · Sxgura Inc';
    document.querySelectorAll('[data-i]').forEach(e => e.textContent = t(e.dataset.i));
    document.querySelectorAll('.mode').forEach((b, i) => b.textContent = t(['one', 'two', 'three'][i]));
    $('bLang').textContent = S.lang.toUpperCase();
    document.querySelectorAll('#themes .chip span').forEach(s => s.textContent = t(s.parentNode.dataset.k));
    if (!rolling && !lastText) $('result').textContent = t('ready');
    renderHist();
  }

  /* ---------- dados 3D ---------- */
  const PIP = { 1: [5], 2: [1, 9], 3: [1, 5, 9], 4: [1, 3, 7, 9], 5: [1, 3, 5, 7, 9], 6: [1, 3, 4, 6, 7, 9] };
  const ROT = { 1: [0, 0], 2: [0, -90], 3: [-90, 0], 4: [90, 0], 5: [0, 90], 6: [0, 180] };
  const scene = $('scene'), dice = [];
  for (let i = 0; i < 3; i++) {
    const wrap = document.createElement('div'); wrap.className = 'dw';
    const sh = document.createElement('div'); sh.className = 'shadow';
    const die = document.createElement('div'); die.className = 'die';
    for (let n = 1; n <= 6; n++) {
      const f = document.createElement('div'); f.className = 'face f' + n;
      const g = document.createElement('div'); g.className = 'grid';
      for (let c = 1; c <= 9; c++) { const cell = document.createElement('div'); if (PIP[n].includes(c)) { const p = document.createElement('div'); p.className = 'pip'; cell.appendChild(p); } g.appendChild(cell); }
      f.appendChild(g); die.appendChild(f);
    }
    // relleno sólido: láminas internas cerca de cada cara para que no queden huecos en las esquinas redondeadas
    for (let ax = 0; ax < 3; ax++) for (let k = 1; k <= 5; k++) for (const sg of [1, -1]) {
      const sl = document.createElement('div'); sl.className = 'slab';
      const z = 'calc(var(--s)/2 - ' + (k * 3) + 'px)';
      const pre = ax === 0 ? '' : ax === 1 ? 'rotateY(90deg) ' : 'rotateX(90deg) ';
      sl.style.transform = pre + 'translateZ(' + (sg > 0 ? z : 'calc(-1 * ' + z + ')') + ')';
      die.appendChild(sl);
    }
    // posición inicial distinta para que se vea tridimensional
    const v0 = [5, 4, 2][i], rx = ROT[v0][0], ry = ROT[v0][1];
    die.style.transform = 'rotateX(' + rx + 'deg) rotateY(' + ry + 'deg)';
    wrap.appendChild(sh); wrap.appendChild(die); scene.appendChild(wrap);
    dice.push({ wrap, sh, die, rx, ry, val: v0 });
  }
  function setCount(n) {
    S.count = n; save();
    scene.className = 'scene' + (n > 1 ? ' c' + n : '');
    dice.forEach((d, i) => d.wrap.classList.toggle('hide', i >= n));
    document.querySelectorAll('.mode').forEach(b => b.classList.toggle('active', +b.dataset.n === n));
  }

  /* ---------- sonido (WebAudio, todo sintetizado) ---------- */
  let ctx = null, master = null, noise = null;
  function audio() {
    if (!S.sound) return false;
    try {
      if (!ctx) {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        master = ctx.createGain(); master.connect(ctx.destination);
        noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
        const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
      master.gain.value = S.vol; if (ctx.state === 'suspended') ctx.resume(); return true;
    } catch (e) { return false; }
  }
  let dest = null; // salida (con paneo) del dado que se está programando
  const out = () => dest || master;
  function nz(t, f, q, len, g, type) {
    const s = ctx.createBufferSource(); s.buffer = noise;
    const fl = ctx.createBiquadFilter(); fl.type = type || 'bandpass'; fl.frequency.value = f; fl.Q.value = q;
    const gn = ctx.createGain();
    gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(Math.max(g, .0002), t + .003); gn.gain.exponentialRampToValueAtTime(0.0001, t + len);
    s.connect(fl); fl.connect(gn); gn.connect(out()); s.start(t, Math.random() * .6); s.stop(t + len + .03);
  }
  function tone(t, f0, f1, len, g, type) {
    const o = ctx.createOscillator(), gn = ctx.createGain(); o.type = type || 'sine';
    o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(f1, 20), t + len);
    gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(g, t + .004); gn.gain.exponentialRampToValueAtTime(0.0001, t + len + .02);
    o.connect(gn); gn.connect(out()); o.start(t); o.stop(t + len + .05);
  }
  // resorte: "boing" agudo con vibrato y parciales metálicos de la bobina
  function spring(t, k, f0) {
    const base = f0 || (640 + Math.random() * 220);
    const o = ctx.createOscillator(), lfo = ctx.createOscillator(), lg = ctx.createGain(), gn = ctx.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(base * 1.55, t); o.frequency.exponentialRampToValueAtTime(base * .8, t + .12 + .22 * k);
    lfo.frequency.value = 24 + Math.random() * 8; lg.gain.value = base * .13; lfo.connect(lg); lg.connect(o.frequency);
    gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(.22 * k, t + .006); gn.gain.exponentialRampToValueAtTime(0.0001, t + .14 + .3 * k);
    o.connect(gn); gn.connect(out()); o.start(t); lfo.start(t); o.stop(t + .5); lfo.stop(t + .5);
    [2.76, 5.4, 8.9].forEach((m, i) => tone(t, base * m, base * m * .9, .16 - i * .03, .06 * k / (i + 1), 'sine'));
  }
  // golpe seco y agudo del dado contra la mesa
  function tok(t, k) {
    tone(t, 560, 220, .07, .34 * k, 'triangle'); nz(t, 3400, 1.5, .04, .5 * k); nz(t, 5600, 2, .025, .32 * k); nz(t, 1200, .9, .06, .22 * k);
  }
  function sndRoll(t0, dur, n) {
    for (let k = 0; k < n; k++) {
      // paneo simétrico: izquierda / centro / derecha
      const lane = k - (n - 1) / 2;
      dest = null;
      if (ctx.createStereoPanner) { const pn = ctx.createStereoPanner(); pn.pan.value = n > 1 ? lane * (n === 2 ? 1.1 : .7) : 0; pn.connect(master); dest = pn; }
      const air = dur * .4;
      nz(t0, 900, .7, air * .9, .1, 'bandpass'); // silbido suave del giro
      let tt = t0 + .02;
      const endAir = t0 + air;
      let sp = 0;
      while (tt < endAir) { // clacs agudos y rápidos del dado girando + chasquidos de resorte
        nz(tt, 2600 + Math.random() * 3200, 5, .015 + Math.random() * .015, .1 + Math.random() * .14);
        if (++sp % 5 === 0) spring(tt, .28, 760 + Math.random() * 300);
        tt += .016 + Math.random() * .022;
      }
      [.40, .68, .87].forEach((p, i) => { const kk = [1, .62, .34][i]; tok(t0 + dur * p, kk); spring(t0 + dur * p + .004, kk); });
      let r = t0 + dur * .40 + .05; const endR = t0 + dur * .97;
      while (r < endR) {
        const p = (r - (t0 + dur * .4)) / (dur * .57);
        nz(r, 2200 + Math.random() * 2200, 4, .018, .08 * (1 - p * .7));
        if (Math.random() < .35) spring(r, .16 * (1 - p * .5), 900 + Math.random() * 300);
        r += .03 + p * .1 + Math.random() * .02;
      }
      tok(t0 + dur, .2);
      dest = null;
    }
  }
  function sndChime(t0) { dest = null; [784, 988, 1175, 1568].forEach((f, i) => tone(t0 + i * .09, f, f, .35, .15, 'sine')); }
  function vibe(p) { if (S.vib && navigator.vibrate) { try { navigator.vibrate(p); } catch (e) {} } }

  /* ---------- tirada ---------- */
  let rolling = false, lastText = '';
  function rnd() { const a = new Uint32Array(1); do { crypto.getRandomValues(a); } while (a[0] >= 4294967292); return 1 + (a[0] % 6); }
  const rm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  function animateDie(d, val, dur, delay, idx, n) {
    const lane = idx - (n - 1) / 2, dir = Math.sign(lane);
    const [bx, by] = ROT[val];
    const tx = bx + 360 * (Math.ceil((d.rx - bx) / 360) + 2 + Math.floor(Math.random() * 2));
    const ty = by + 360 * (Math.ceil((d.ry - by) / 360) + 2 + Math.floor(Math.random() * 2));
    const from = 'rotateX(' + d.rx + 'deg) rotateY(' + d.ry + 'deg) rotateZ(0deg)';
    const mid = 'rotateX(' + ((d.rx + tx) / 2 + 40) + 'deg) rotateY(' + ((d.ry + ty) / 2 - 30) + 'deg) rotateZ(' + (dir < 0 ? -34 : 34) + 'deg)';
    const to = 'rotateX(' + tx + 'deg) rotateY(' + ty + 'deg) rotateZ(0deg)';
    d.die.style.transform = 'rotateX(' + bx + 'deg) rotateY(' + by + 'deg)';
    const S0 = d.wrap.offsetWidth || 100, sx = dir * S0 * (n === 3 ? .1 : .2), H = S0; // hacia afuera y simétrico: nunca se cruzan
    const ease = 'cubic-bezier(.2,.7,.4,1)', fall = 'cubic-bezier(.55,0,.85,.4)';
    const opt = { duration: dur, delay, fill: 'backwards', easing: 'linear' };
    d.die.animate([{ transform: from, offset: 0, easing: 'cubic-bezier(.1,.55,.3,1)' }, { transform: mid, offset: .45, easing: 'cubic-bezier(.2,.6,.35,1)' }, { transform: to, offset: 1 }], { duration: dur, delay, fill: 'backwards' });
    d.wrap.animate([
      { transform: 'translate(' + sx + 'px,0) scale(1)', offset: 0, easing: ease },
      { transform: 'translate(' + sx * .5 + 'px,' + (-H * .9) + 'px) scale(1.14)', offset: .18, easing: fall },
      { transform: 'translate(' + sx * .15 + 'px,0) scale(1)', offset: .40, easing: ease },
      { transform: 'translate(' + sx * .06 + 'px,' + (-H * .38) + 'px) scale(1.05)', offset: .55, easing: fall },
      { transform: 'translate(0,0) scale(1)', offset: .68, easing: ease },
      { transform: 'translate(0,' + (-H * .14) + 'px) scale(1.02)', offset: .78, easing: fall },
      { transform: 'translate(0,0) scale(1)', offset: .87, easing: ease },
      { transform: 'translate(0,' + (-H * .045) + 'px)', offset: .93, easing: fall },
      { transform: 'translate(0,0) scale(1)', offset: 1 }
    ], opt);
    d.sh.animate([
      { transform: 'scale(1,1)', opacity: 1, offset: 0 }, { transform: 'scale(.45,.45)', opacity: .35, offset: .18 }, { transform: 'scale(1,1)', opacity: 1, offset: .40 },
      { transform: 'scale(.75,.75)', opacity: .6, offset: .55 }, { transform: 'scale(1,1)', opacity: 1, offset: .68 }, { transform: 'scale(.92,.92)', opacity: .9, offset: .78 }, { transform: 'scale(1,1)', opacity: 1, offset: 1 }
    ], opt);
    d.rx = bx; d.ry = by; d.val = val;
  }

  function roll() {
    if (rolling) return;
    rolling = true; $('rollBtn').disabled = true; lastText = '';
    const r = $('result'); r.className = 'result'; r.textContent = t('rolling');
    document.querySelectorAll('.mode').forEach(b => b.disabled = true);
    const n = S.count, dur = rm ? 400 : 1500, vals = [], offs = [];
    for (let i = 0; i < n; i++) { vals.push(rnd()); offs.push(0); }
    for (let i = 0; i < n; i++) animateDie(dice[i], vals[i], dur, 0, i, n);
    if (audio()) sndRoll(ctx.currentTime + .02, dur / 1000, n);
    if (S.vib) { const hits = [.40, .68, .87, 1]; hits.forEach((p, i) => setTimeout(() => vibe([22, 12, 10][i] || 8), dur * p + 70)); }
    setTimeout(() => finish(vals), dur + 80);
  }
  function finish(vals) {
    const sum = vals.reduce((a, b) => a + b, 0), n = vals.length, same = n > 1 && vals.every(v => v === vals[0]);
    let txt = n === 1 ? t('came') + vals[0] : vals.join(' + ') + ' = ' + sum;
    lastText = txt;
    const r = $('result'); r.className = 'result win'; r.innerHTML = '';
    r.appendChild(document.createTextNode(txt));
    if (same) { const s = document.createElement('small'); s.textContent = n === 2 ? t('doubles') : t('triples'); r.appendChild(s); if (audio()) sndChime(ctx.currentTime + .05); vibe([30, 40, 60]); }
    ST.rolls++; ST.sum += sum; ST.max = Math.max(ST.max, sum); ST.hist.unshift(n === 1 ? String(vals[0]) : vals.join('+') + '=' + sum); ST.hist = ST.hist.slice(0, 10); save();
    renderHist(); rolling = false; $('rollBtn').disabled = false; document.querySelectorAll('.mode').forEach(b => b.disabled = false);
  }
  function renderHist() {
    const h = $('hist'); h.innerHTML = '';
    if (!ST.hist.length) { const s = document.createElement('span'); s.className = 'none'; s.textContent = t('none'); h.appendChild(s); }
    ST.hist.forEach(x => { const s = document.createElement('span'); s.className = 'h'; s.textContent = x; h.appendChild(s); });
    $('sRolls').textContent = ST.rolls; $('sAvg').textContent = ST.rolls ? (ST.sum / ST.rolls).toFixed(1) : '0'; $('sMax').textContent = ST.max;
  }

  /* ---------- eventos ---------- */
  document.querySelectorAll('.mode').forEach(b => b.onclick = () => { if (rolling) return; setCount(+b.dataset.n); lastText = ''; $('result').className = 'result'; $('result').textContent = t('ready'); });
  $('rollBtn').onclick = roll; $('table').onclick = roll;
  document.addEventListener('keydown', e => { if ((e.code === 'Space' || e.code === 'Enter') && document.activeElement === document.body) { e.preventDefault(); roll(); } });
  $('bClear').onclick = () => { ST.rolls = 0; ST.sum = 0; ST.max = 0; ST.hist = []; save(); renderHist(); };
  $('bLang').onclick = () => { S.lang = S.lang === 'es' ? 'en' : 'es'; save(); applyLang(); };
  const TH = [['marfil', '#f6f6f8', '#cfcfd6'], ['rojo', '#ef4a4a', '#a31616'], ['negro', '#3b3b42', '#0f0f12'], ['neon', '#13203d', '#19d3c2'], ['azul', '#5aa2ff', '#1747b8']];
  TH.forEach(([k, c1, c2]) => { const b = document.createElement('button'); b.className = 'chip'; b.dataset.k = k; b.style.setProperty('--c1', c1); b.style.setProperty('--c2', c2); b.innerHTML = '<i></i><span></span>'; b.onclick = () => { S.theme = k; save(); applyTheme(); }; $('themes').appendChild(b); });
  function applyTheme() { document.documentElement.dataset.theme = S.theme; document.querySelectorAll('#themes .chip').forEach(c => c.classList.toggle('on', c.dataset.k === S.theme)); }
  function applySettings() { $('swSnd').setAttribute('aria-pressed', S.sound); $('swVib').setAttribute('aria-pressed', S.vib); $('rgVol').value = Math.round(S.vol * 100); $('rgVol').disabled = !S.sound; }
  $('swSnd').onclick = () => { S.sound = !S.sound; save(); applySettings(); if (S.sound && audio()) { dest = null; tok(ctx.currentTime + .01, .6); spring(ctx.currentTime + .012, .6); } };
  $('swVib').onclick = () => { S.vib = !S.vib; save(); applySettings(); vibe(30); };
  $('rgVol').oninput = e => { S.vol = e.target.value / 100; if (master) master.gain.value = S.vol; save(); };
  $('rgVol').onchange = () => { if (audio()) { dest = null; tok(ctx.currentTime + .01, .6); spring(ctx.currentTime + .012, .6); } };
  window.__dados = { S, ST, dice, roll, get rolling() { return rolling; } };

  setCount(S.count); applyTheme(); applySettings(); applyLang();
})();
</script>
