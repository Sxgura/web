<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Downloader Cyber PRO</title>

<style>
body{
  margin:0;
  font-family:Arial;
 background:#000;
animation:none;
  color:#fff;

  /* 🔥 FIX SCROLL */
  display:block;
  min-height:100vh;
  overflow-y:auto;
}

.container{
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  padding:20px;
}


/* caja */
.box{
  width:260px;
  padding:20px;
  background:rgba(0,0,0,0.7);
  backdrop-filter:blur(8px);
  border-radius:18px;
  text-align:center;
  box-shadow:0 0 20px rgba(100,100,255,0.2);
  animation:fadeIn 1s ease, glow 3s infinite alternate;
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(20px);}
  to{opacity:1;}
}

@keyframes glow{
  from{box-shadow:0 0 15px #3a6cff;}
  to{box-shadow:0 0 30px #7b3cff;}
}

/* input */
.input-box{position:relative;}

input{
  width:100%;
  padding:12px 45px 12px 12px;
  border:none;
  border-radius:10px;
  background:#0a0f2c;
  color:#fff;
  box-sizing:border-box;
  border:1px solid transparent;
  transition:border-color .25s ease, box-shadow .25s ease;
}

input:focus{
  outline:none;
  border-color:#7b3cff;
  box-shadow:0 0 10px rgba(123,60,255,0.5);
}

.clear-btn{
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  cursor:pointer;
  opacity:.7;
}
.clear-btn:hover{opacity:1;}

/* estado (detectando / buscando) */
.status{
  margin-top:8px;
  font-size:11px;
  min-height:14px;
  color:#9aa8ff;
  letter-spacing:.3px;
}

/* spinner de búsqueda */
.spinner{
  width:26px;
  height:26px;
  margin:14px auto 0;
  border:3px solid rgba(123,60,255,0.25);
  border-top-color:#7b3cff;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg);}
}

/* aviso (sin resultados / pega el enlace) */
.aviso{
  margin-top:12px;
  padding:8px;
  font-size:12px;
  color:#c9cfff;
  background:rgba(123,60,255,0.12);
  border-radius:8px;
}

/* video */
video{
  width:180px;
  margin-top:15px;
  border-radius:12px;
  animation:fadeIn 0.6s ease;
}

/* link */
a{
  display:block;
  margin-top:10px;
  padding:8px;
  background:#3a6cff;
  color:#fff;
  border-radius:8px;
  text-decoration:none;
}

/* footer */
.footer{
  margin-top:20px;
  font-size:11px;
  color:#888;
  opacity:0.7;
}


</style>
</head>

<body>

<div class="container">
  <div class="box">
    <h2>Instagram Downloader</h2>

    <div class="input-box">
      <input id="link" placeholder="Ej: instagram.com/reel/...">
      <span class="clear-btn" onclick="limpiar()">✖</span>
    </div>

    <div class="status" id="status"></div>

    <div id="resultado"></div>

    <div class="footer">Sxgura Inc</div>
  </div>
</div>


<script>
const input = document.getElementById("link");
const statusEl = document.getElementById("status");
const resDiv = document.getElementById("resultado");

let debounceTimer = null;
let avisoTimer = null;
let statusTimer = null;
let ultimoLinkProcesado = "";

function esLinkInstagram(texto){
  return /https?:\/\/(www\.)?instagram\.com\/(p|reel|reels|tv|stories)\//i.test(texto.trim());
}

// Muestra un mensaje temporal (se borra solo a los 3 segundos)
function mostrarAviso(mensaje){
  clearTimeout(avisoTimer);
  resDiv.innerHTML = `<div class="aviso">${mensaje}</div>`;
  avisoTimer = setTimeout(() => { resDiv.innerHTML=""; }, 6000);
}

// Muestra el estado (buscando/listo) y lo vuelve a la normalidad a los 3 segundos
function mostrarEstado(mensaje){
  clearTimeout(statusTimer);
  statusEl.textContent = mensaje;
  if(mensaje){
    statusTimer = setTimeout(() => { statusEl.textContent=""; }, 3000);
  }
}

function limpiar(){
  input.value="";
  resDiv.innerHTML="";
  statusEl.textContent="";
  clearTimeout(avisoTimer);
  clearTimeout(statusTimer);
  ultimoLinkProcesado="";
}

// Descarga inteligente: al pegar/escribir un enlace válido, se busca solo
input.addEventListener("input", () => {
  clearTimeout(debounceTimer);
  const valor = input.value.trim();

  if(!valor){
    statusEl.textContent="";
    resDiv.innerHTML="";
    ultimoLinkProcesado="";
    return;
  }

  if(esLinkInstagram(valor)){
    statusEl.textContent="Enlace detectado, buscando...";
    debounceTimer = setTimeout(() => {
      if(valor !== ultimoLinkProcesado){
        ultimoLinkProcesado = valor;
        descargar();
      }
    }, 600);
  }else{
    statusEl.textContent="";
  }
});

input.addEventListener("keydown", (e) => {
  if(e.key === "Enter"){
    clearTimeout(debounceTimer);
    descargar();
  }
});

/* ===== APIs (se prueban en orden; si una falla pasa a la siguiente) =====
   Para añadir otra API: agrega una línea con su URL y la palabra URL donde va el enlace. */
const APIS = [
  "https://api.deline.web.id/downloader/ig?url=",
  // "https://OTRA-API.com/ig?url=",
];

// Busca recursivamente enlaces de video/imagen en cualquier formato de respuesta
function extraerMedia(obj){
  const videos=new Set(), imgs=new Set();
  (function rec(o,k){
    if(!o) return;
    if(typeof o==="string"){
      if(!/^https?:\/\//i.test(o)) return;
      if(/\.(mp4|mov|webm)(\?|$)|video/i.test(o+" "+(k||""))) videos.add(o);
      else if(/\.(jpe?g|png|webp)(\?|$)|image|thumb|photo|img/i.test(o+" "+(k||""))) imgs.add(o);
      return;
    }
    if(Array.isArray(o)){ o.forEach(v=>rec(v,k)); return; }
    if(typeof o==="object"){ for(const key in o) rec(o[key],key); }
  })(obj,"");
  return {videos:[...videos], imgs:[...imgs]};
}

async function pedir(base,link){
  const ctrl=new AbortController();
  const t=setTimeout(()=>ctrl.abort(),20000);
  try{
    const res=await fetch(base+encodeURIComponent(link),{signal:ctrl.signal});
    if(!res.ok) throw new Error("HTTP "+res.status);
    return await res.json();
  }finally{ clearTimeout(t); }
}

// Descarga real: baja el archivo y lo guarda (el atributo download no funciona con enlaces de otro dominio)
async function guardar(url,nombre,btn){
  const txt=btn.textContent; btn.textContent="Descargando...";
  try{
    const r=await fetch(url); if(!r.ok) throw 0;
    const b=await r.blob();
    const a=document.createElement("a");
    a.href=URL.createObjectURL(b); a.download=nombre; document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
    btn.textContent="Guardado ✔";
  }catch{
    window.open(url,"_blank"); btn.textContent=txt; // respaldo: abrir y guardar manualmente
  }
}

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");}

async function descargar(){
  const link=document.getElementById("link").value.trim();
  if(!link){ mostrarAviso("Pega el enlace y listo"); return; }

  clearTimeout(avisoTimer);
  statusEl.textContent = "Buscando...";
  resDiv.innerHTML=`<div class="spinner"></div>`;

  let ultimoError="";
  for(const base of APIS){
    try{
      const data=await pedir(base,link);
      const m=extraerMedia(data);
      if(m.videos.length || m.imgs.length){
        let html="";
        m.videos.slice(0,5).forEach((v,i)=>{
          html+=`<video controls playsinline src="${esc(v)}"></video><a href="#" data-u="${esc(v)}" data-n="instagram_${Date.now()}_${i+1}.mp4">Guardar video</a>`;
        });
        if(!m.videos.length) m.imgs.slice(0,5).forEach((v,i)=>{
          html+=`<img src="${esc(v)}" style="width:180px;margin-top:15px;border-radius:12px"><a href="#" data-u="${esc(v)}" data-n="instagram_${Date.now()}_${i+1}.jpg">Guardar imagen</a>`;
        });
        resDiv.innerHTML=html;
        resDiv.querySelectorAll("a[data-u]").forEach(a=>a.addEventListener("click",e=>{e.preventDefault();guardar(a.dataset.u,a.dataset.n,a);}));
        mostrarEstado("Listo ✔");
        return;
      }
      ultimoError="sin resultados";
    }catch(e){
      ultimoError=(e&&e.name==="AbortError")?"tiempo agotado":(e&&e.message)||"sin conexión";
    }
  }
  const detalle = ultimoError==="sin resultados" ? "Enlace incorrecto, privado o sin resultados"
                : "El servicio de descarga no responde ("+ultimoError+"). Intenta más tarde";
  mostrarAviso(detalle);
  statusEl.textContent="";
}
</script>

</body>
</html>
