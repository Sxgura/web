<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Galaxy Shooter</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background: #02020a;
    color: #e0f7ff;
    font-family: 'Orbitron', Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
  }

  #loader {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at center, #0a0a20 0%, #000 70%);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 100;
    transition: opacity 0.6s ease;
  }

  .title {
    font-size: 2.4rem;
    font-weight: 700;
    letter-spacing: 4px;
    background: linear-gradient(90deg, #00eaff, #6a00ff, #ff00aa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: glow 2s ease-in-out infinite alternate;
  }

  .subtitle {
    margin-top: 10px;
    font-size: 0.95rem;
    opacity: 0.7;
    letter-spacing: 2px;
  }

  .bar {
    margin-top: 28px;
    width: 220px;
    height: 6px;
    background: #111;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid #222;
  }

  .fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #00eaff, #6a00ff);
    animation: load 3.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  }

  @keyframes glow {
    from { filter: drop-shadow(0 0 8px #00eaff88); }
    to   { filter: drop-shadow(0 0 20px #6a00ffaa); }
  }

  @keyframes load {
    from { width: 0%; }
    to   { width: 100%; }
  }

  #ui {
    display: none;
    width: 100%;
    max-width: 400px;
    padding: 12px 16px 0;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    font-size: 0.85rem;
  }

  .stat {
    background: rgba(0, 20, 40, 0.6);
    border: 1px solid #1a3a5a;
    padding: 6px 12px;
    border-radius: 8px;
    backdrop-filter: blur(4px);
  }

  .stat b {
    color: #00eaff;
  }

  .controls {
    display: flex;
    gap: 6px;
  }

  button {
    background: linear-gradient(180deg, #1a1a3a, #0d0d20);
    border: 1px solid #3a3a6a;
    color: #e0f7ff;
    padding: 7px 12px;
    border-radius: 8px;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.75rem;
    cursor: pointer;
    transition: all 0.2s;
  }

  button:hover {
    background: linear-gradient(180deg, #2a2a5a, #151530);
    border-color: #00eaff;
    box-shadow: 0 0 12px #00eaff44;
  }

  button.active {
    border-color: #00eaff;
    box-shadow: 0 0 10px #00eaff66;
  }

  #game {
    display: none;
    background: radial-gradient(ellipse at center, #0a0a22 0%, #000 70%);
    border: 2px solid #4a00aa;
    border-radius: 14px;
    box-shadow: 0 0 30px #6a00ff44, inset 0 0 40px #000a;
    margin-top: 8px;
    touch-action: none;
  }

  #footer {
    display: none;
    margin-top: 10px;
    font-size: 0.7rem;
    opacity: 0.45;
    letter-spacing: 1px;
  }

  #overlay {
    display: none;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(5, 5, 20, 0.92);
    border: 2px solid #6a00ff;
    border-radius: 16px;
    padding: 28px 36px;
    text-align: center;
    z-index: 20;
    box-shadow: 0 0 40px #6a00ff66;
    backdrop-filter: blur(8px);
  }

  #overlay h2 {
    font-size: 1.8rem;
    margin-bottom: 12px;
    background: linear-gradient(90deg, #ff4d6d, #ff00aa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  #overlay p {
    margin: 6px 0;
    font-size: 0.95rem;
  }

  #overlay button {
    margin-top: 18px;
    padding: 10px 24px;
    font-size: 0.9rem;
  }
</style>
</head>
<body>

<div id="loader">
  <div class="title">GALAXY SHOOTER</div>
  <div class="subtitle">By Sxgura Inc</div>
  <div class="bar"><div class="fill"></div></div>
</div>

<div id="ui">
  <div class="stat">Puntos: <b id="score">0</b></div>
  <div class="stat">❤️ <b id="lives">3</b></div>
  <div class="stat">⏱️ <b id="time">00:00</b></div>
  <div class="stat">🏆 <b id="high">0</b></div>
  <div class="controls">
    <button id="soundBtn" onclick="toggleSound()">🔇</button>
    <button id="pauseBtn" onclick="togglePause()">Pausar</button>
    <button onclick="restart()">Reiniciar</button>
  </div>
</div>

<canvas id="game" width="400" height="600"></canvas>

<div id="footer">By Sxgura Inc • Galaxy Shooter</div>

<div id="overlay">
  <h2>GAME OVER</h2>
  <p>Puntuación: <b id="finalScore">0</b></p>
  <p>Récord: <b id="finalHigh">0</b></p>
  <button onclick="restart()">Jugar de nuevo</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const livesEl = document.getElementById("lives");
const timeEl = document.getElementById("time");
const highEl = document.getElementById("high");
const pauseBtn = document.getElementById("pauseBtn");
const soundBtn = document.getElementById("soundBtn");
const overlay = document.getElementById("overlay");

let player, bullets, enemies, particles, stars, powerUps;
let score = 0, lives = 3, highScore = 0;
let gameOver = false, paused = false;
let startTime = 0, elapsed = 0;
let lastShot = 0;
let shootCooldown = 180;
let rapidFire = false, rapidUntil = 0;
let keys = {};
let audioCtx, soundEnabled = false;
let bgOsc = null;
let lastSpawn = 0;

// ========== AUDIO ==========
function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}

function playTone(freq, type, duration, vol = 0.05) {
  if (!soundEnabled || !audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function playLaser() {
  playTone(680, "sine", 0.06, 0.035);
}

function playExplosion() {
  playTone(90, "triangle", 0.25, 0.07);
}

function playPower() {
  playTone(440, "sine", 0.15, 0.05);
  setTimeout(() => playTone(660, "sine", 0.15, 0.04), 80);
}

function playHit() {
  playTone(180, "sawtooth", 0.12, 0.04);
}

function startBackground() {
  if (!soundEnabled || bgOsc) return;
  bgOsc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  bgOsc.type = "sine";
  bgOsc.frequency.value = 55;
  gain.gain.value = 0.022; // más fuerte
  bgOsc.connect(gain);
  gain.connect(audioCtx.destination);
  bgOsc.start();
}

function stopBackground() {
  if (bgOsc) {
    try { bgOsc.stop(); } catch(e) {}
    bgOsc = null;
  }
}

function toggleSound() {
  initAudio();
  soundEnabled = !soundEnabled;
  soundBtn.textContent = soundEnabled ? "🔊" : "🔇";
  soundBtn.classList.toggle("active", soundEnabled);
  if (soundEnabled) startBackground();
  else stopBackground();
}

// ========== INIT ==========
function init() {
  player = {
    x: 200,
    y: 530,
    width: 36,
    height: 42,
    invincible: 0
  };
  bullets = [];
  enemies = [];
  particles = [];
  powerUps = [];
  stars = [];

  for (let i = 0; i < 120; i++) {
    stars.push({
      x: Math.random() * 400,
      y: Math.random() * 600,
      size: Math.random() * 1.8 + 0.3,
      speed: Math.random() * 1.2 + 0.3,
      alpha: Math.random() * 0.6 + 0.3
    });
  }

  score = 0;
  lives = 3;
  gameOver = false;
  paused = false;
  rapidFire = false;
  shootCooldown = 180;
  startTime = Date.now();
  elapsed = 0;
  lastShot = 0;
  lastSpawn = 0;

  scoreEl.textContent = "0";
  livesEl.textContent = "3";
  timeEl.textContent = "00:00";
  highScore = parseInt(localStorage.getItem("galaxyHigh") || "0");
  highEl.textContent = highScore;

  overlay.style.display = "none";
  pauseBtn.textContent = "Pausar";
}

// ========== ENTIDADES ==========
function spawnEnemy() {
  if (paused || gameOver) return;

  // Más enemigos según el puntaje
  const difficulty = Math.min(score / 40, 4); // hasta 4x más
  const baseChance = 0.7 + difficulty * 0.15;

  if (Math.random() > baseChance && score < 20) return;

  const type = Math.random() < 0.18 + (score * 0.002) ? 2 : 1;
  const size = type === 2 ? 28 : 18;
  enemies.push({
    x: 30 + Math.random() * 340,
    y: -30,
    size: size,
    speed: 1.9 + Math.random() * 1.5 + score * 0.015,
    type: type,
    hp: type
  });

  // A veces aparece un segundo enemigo a partir de cierto puntaje
  if (score > 25 && Math.random() < 0.35 + difficulty * 0.1) {
    enemies.push({
      x: 30 + Math.random() * 340,
      y: -50,
      size: 18,
      speed: 2.1 + Math.random() * 1.3 + score * 0.012,
      type: 1,
      hp: 1
    });
  }
}

function spawnPowerUp(x, y) {
  if (Math.random() < 0.20) {
    powerUps.push({
      x: x,
      y: y,
      type: "rapid",
      life: 320
    });
  }
}

function shoot() {
  if (gameOver || paused) return;
  const now = Date.now();
  const cd = rapidFire ? 65 : shootCooldown;
  if (now - lastShot < cd) return;

  lastShot = now;
  bullets.push({ x: player.x - 9, y: player.y - 10, vy: -13 });
  bullets.push({ x: player.x + 9, y: player.y - 10, vy: -13 });

  // Triple rayo solo en fuego rápido
  if (rapidFire) {
    bullets.push({ x: player.x, y: player.y - 14, vy: -15 });
  }
  playLaser();
}

// ========== UPDATE ==========
function update() {
  if (gameOver || paused) return;

  // Temporizador (arreglado)
  elapsed = Math.floor((Date.now() - startTime) / 1000);
  const min = String(Math.floor(elapsed / 60)).padStart(2, "0");
  const sec = String(elapsed % 60).padStart(2, "0");
  timeEl.textContent = `\( {min}: \){sec}`;

  // Rapid fire timer
  if (rapidFire && Date.now() > rapidUntil) {
    rapidFire = false;
  }

  // Movimiento jugador
  const speed = 6.5;
  if (keys["ArrowLeft"] || keys["a"] || keys["A"]) player.x -= speed;
  if (keys["ArrowRight"] || keys["d"] || keys["D"]) player.x += speed;
  player.x = Math.max(22, Math.min(378, player.x));

  if (player.invincible > 0) player.invincible--;

  // Disparo automático
  shoot();

  // Spawn dinámico según puntaje (más enemigos)
  const spawnInterval = Math.max(280, 720 - score * 4.5);
  if (Date.now() - lastSpawn > spawnInterval) {
    spawnEnemy();
    lastSpawn = Date.now();
  }

  // Balas
  bullets.forEach(b => b.y += b.vy);
  bullets = bullets.filter(b => b.y > -30);

  // Enemigos
  enemies.forEach(e => e.y += e.speed);
  enemies = enemies.filter(e => e.y < 640);

  // Power-ups
  powerUps.forEach(p => {
    p.y += 1.8;
    p.life--;
  });
  powerUps = powerUps.filter(p => p.life > 0 && p.y < 620);

  // Partículas
  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
    p.vx *= 0.97;
    p.vy *= 0.97;
  });
  particles = particles.filter(p => p.life > 0);

  // Colisiones balas-enemigos
  for (let bi = bullets.length - 1; bi >= 0; bi--) {
    const b = bullets[bi];
    for (let ei = enemies.length - 1; ei >= 0; ei--) {
      const e = enemies[ei];
      if (Math.hypot(b.x - e.x, b.y - e.y) < e.size + 4) {
        e.hp--;
        bullets.splice(bi, 1);
        createExplosion(e.x, e.y, e.type === 2 ? 16 : 10);

        if (e.hp <= 0) {
          playExplosion();
          enemies.splice(ei, 1);
          score += e.type === 2 ? 3 : 1;
          scoreEl.textContent = score;
          spawnPowerUp(e.x, e.y);
          if (score > highScore) {
            highScore = score;
            highEl.textContent = highScore;
            localStorage.setItem("galaxyHigh", highScore);
          }
        } else {
          playHit();
        }
        break;
      }
    }
  }

  // Colisión jugador-enemigos
  if (player.invincible <= 0) {
    for (let ei = enemies.length - 1; ei >= 0; ei--) {
      const e = enemies[ei];
      if (Math.hypot(player.x - e.x, player.y - e.y) < e.size + 16) {
        enemies.splice(ei, 1);
        createExplosion(e.x, e.y, 14);
        playExplosion();
        lives--;
        livesEl.textContent = lives;
        player.invincible = 90;
        if (lives <= 0) {
          endGame();
        }
        break;
      }
    }
  }

  // Power-ups
  powerUps.forEach((p, i) => {
    if (Math.hypot(player.x - p.x, player.y - p.y) < 26) {
      powerUps.splice(i, 1);
      rapidFire = true;
      rapidUntil = Date.now() + 9000;
      playPower();
    }
  });
}

// ========== DRAW ==========
function createExplosion(x, y, count = 12) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 3.5 + 1;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 25 + Math.random() * 15,
      color: Math.random() > 0.4 ? "#ff6b00" : "#ffcc00",
      size: Math.random() * 3 + 1.5
    });
  }
}

function drawShip(x, y, invincible) {
  ctx.save();
  if (invincible > 0 && Math.floor(invincible / 4) % 2 === 0) {
    ctx.globalAlpha = 0.4;
  }

  // Propulsor
  const flame = 8 + Math.sin(Date.now() / 50) * 4;
  ctx.fillStyle = "#00aaff";
  ctx.beginPath();
  ctx.moveTo(x - 6, y + 12);
  ctx.lineTo(x, y + 12 + flame);
  ctx.lineTo(x + 6, y + 12);
  ctx.fill();

  // Cuerpo principal
  const grad = ctx.createLinearGradient(x, y - 22, x, y + 14);
  grad.addColorStop(0, "#00eaff");
  grad.addColorStop(0.5, "#0088cc");
  grad.addColorStop(1, "#004488");
  ctx.fillStyle = grad;

  ctx.beginPath();
  ctx.moveTo(x, y - 22);
  ctx.lineTo(x - 16, y + 10);
  ctx.lineTo(x - 8, y + 6);
  ctx.lineTo(x - 6, y + 14);
  ctx.lineTo(x + 6, y + 14);
  ctx.lineTo(x + 8, y + 6);
  ctx.lineTo(x + 16, y + 10);
  ctx.closePath();
  ctx.fill();

  // Cabina
  ctx.fillStyle = "#a0f0ff";
  ctx.beginPath();
  ctx.ellipse(x, y - 6, 5, 7, 0, 0, Math.PI * 2);
  ctx.fill();

  // Detalles alas
  ctx.strokeStyle = "#00ffff88";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(x - 12, y + 4);
  ctx.lineTo(x - 6, y - 4);
  ctx.moveTo(x + 12, y + 4);
  ctx.lineTo(x + 6, y - 4);
  ctx.stroke();

  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, 400, 600);

  // Estrellas
  stars.forEach(s => {
    s.y += s.speed;
    if (s.y > 600) {
      s.y = 0;
      s.x = Math.random() * 400;
    }
    ctx.globalAlpha = s.alpha;
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size * 0.5, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  // Power-ups
  powerUps.forEach(p => {
    ctx.save();
    ctx.shadowColor = "#00ffaa";
    ctx.shadowBlur = 15;
    ctx.fillStyle = "#00ffcc";
    ctx.beginPath();
    ctx.arc(p.x, p.y, 9, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#003322";
    ctx.font = "bold 11px Orbitron";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("R", p.x, p.y + 1);
    ctx.restore();
  });

  // Balas
  bullets.forEach(b => {
    const grad = ctx.createLinearGradient(b.x, b.y, b.x, b.y + 18);
    grad.addColorStop(0, "#ffffff");
    grad.addColorStop(0.3, "#00ffff");
    grad.addColorStop(1, "rgba(0,255,255,0)");
    ctx.strokeStyle = grad;
    ctx.lineWidth = 3.5;
    ctx.shadowColor = "#00ffff";
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(b.x, b.y + 16);
    ctx.stroke();
    ctx.shadowBlur = 0;
  });

  // Enemigos
  enemies.forEach(e => {
    ctx.save();
    if (e.type === 2) {
      const g = ctx.createRadialGradient(e.x, e.y, 2, e.x, e.y, e.size);
      g.addColorStop(0, "#ffaaaa");
      g.addColorStop(0.5, "#ff3366");
      g.addColorStop(1, "#880022");
      ctx.fillStyle = g;
      ctx.shadowColor = "#ff0044";
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.moveTo(e.x, e.y - e.size);
      ctx.lineTo(e.x + e.size * 0.9, e.y + e.size * 0.6);
      ctx.lineTo(e.x, e.y + e.size * 0.3);
      ctx.lineTo(e.x - e.size * 0.9, e.y + e.size * 0.6);
      ctx.closePath();
      ctx.fill();
    } else {
      const g = ctx.createRadialGradient(e.x, e.y, 1, e.x, e.y, e.size);
      g.addColorStop(0, "#ff8888");
      g.addColorStop(1, "#cc0022");
      ctx.fillStyle = g;
      ctx.shadowColor = "#ff2244";
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#220000";
      ctx.beginPath();
      ctx.arc(e.x, e.y - 2, 4, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  });

  // Partículas
  particles.forEach(p => {
    ctx.globalAlpha = Math.min(1, p.life / 20);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  // Jugador
  drawShip(player.x, player.y, player.invincible);

  // Texto pausa
  if (paused) {
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    ctx.fillRect(0, 0, 400, 600);
    ctx.fillStyle = "#ffffff";
    ctx.font = "28px Orbitron";
    ctx.textAlign = "center";
    ctx.fillText("PAUSA", 200, 300);
  }
}

// ========== LOOP ==========
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// ========== CONTROLES ==========
canvas.addEventListener("mousemove", e => {
  if (gameOver || paused) return;
  const rect = canvas.getBoundingClientRect();
  player.x = (e.clientX - rect.left) * (canvas.width / rect.width);
});

canvas.addEventListener("touchmove", e => {
  e.preventDefault();
  if (gameOver || paused) return;
  const rect = canvas.getBoundingClientRect();
  const touch = e.touches[0];
  player.x = (touch.clientX - rect.left) * (canvas.width / rect.width);
}, { passive: false });

window.addEventListener("keydown", e => {
  keys[e.key] = true;
  if (e.key === " " || e.key === "p" || e.key === "P") {
    e.preventDefault();
    togglePause();
  }
});

window.addEventListener("keyup", e => {
  keys[e.key] = false;
});

// ========== GAME FLOW ==========
function endGame() {
  gameOver = true;
  document.getElementById("finalScore").textContent = score;
  document.getElementById("finalHigh").textContent = highScore;
  overlay.style.display = "block";
}

function togglePause() {
  if (gameOver) return;
  paused = !paused;
  pauseBtn.textContent = paused ? "Continuar" : "Pausar";
  if (!paused) {
    startTime = Date.now() - elapsed * 1000;
  }
}

function restart() {
  init();
}

// Inicio
setTimeout(() => {
  document.getElementById("loader").style.opacity = "0";
  setTimeout(() => {
    document.getElementById("loader").style.display = "none";
    document.getElementById("ui").style.display = "flex";
    canvas.style.display = "block";
    document.getElementById("footer").style.display = "block";
    init();
    loop();
  }, 500);
}, 3200);
</script>
</body>
</html>
