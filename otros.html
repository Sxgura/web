<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Funciones en desarrollo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;
  background:#000;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  text-align:center;
}
.box{
  max-width:340px;
}
.icon{
  width:64px;
  height:64px;
  margin:0 auto 18px;
  border-radius:50%;
  background:#111;
  border:1px solid #222;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:26px;
}
h1{
  font-size:20px;
  font-weight:700;
  margin-bottom:10px;
}
p{
  font-size:14px;
  color:#888;
  line-height:1.6;
}
.badge{
  display:inline-block;
  margin-top:20px;
  padding:8px 14px;
  border-radius:20px;
  background:#111;
  border:1px solid #222;
  font-size:12px;
  color:#aaa;
}
</style>
</head>
<body>
  <div class="box">
    <div class="icon">⚙️</div>
    <h1>Funciones en desarrollo</h1>
    <p>
      Estas funciones estarán disponibles
      en la próxima actualización.
    </p>
    <div class="badge">Próximamente</div>
  </div>
</body>
</html>
