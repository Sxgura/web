<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notificaciones | S'xgura B'rrokal</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#000;
color:#fff;
min-height:100vh;
display:flex;
flex-direction:column;
}

/* NAVBAR */
.navbar{
display:flex;
align-items:center;
justify-content:space-between;
padding:14px 18px;
background:#000;
border-bottom:1px solid #151515;
position:sticky;
top:0;
z-index:100;
}

.navbar-left{
display:flex;
align-items:center;
gap:14px;
}

.back-btn{
font-size:22px;
color:#fff;
cursor:pointer;
opacity:0.8;
transition:.25s;
}

.back-btn:hover{
opacity:1;
transform:translateX(-3px);
}

.navbar-title{
font-size:18px;
font-weight:700;
color:#fff;
}

/* CONTENIDO */
.container{
flex:1;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
padding:40px 20px;
text-align:center;
}

.icon-box{
width:90px;
height:90px;
border-radius:50%;
background:rgba(255,255,255,0.04);
border:1px solid #222;
display:flex;
align-items:center;
justify-content:center;
margin-bottom:25px;
}

.icon-box i{
font-size:36px;
color:#666;
}

.container h1{
font-size:22px;
font-weight:700;
margin-bottom:12px;
color:#fff;
}

.container p{
font-size:14px;
color:#888;
line-height:1.6;
max-width:280px;
margin-bottom:30px;
}

.status-badge{
display:inline-block;
padding:8px 16px;
border-radius:30px;
background:rgba(255,255,255,0.05);
border:1px solid #222;
font-size:12px;
color:#aaa;
letter-spacing:0.5px;
}

footer{
text-align:center;
padding:20px;
font-size:12px;
color:#555;
border-top:1px solid #111;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
  <div class="navbar-left">
    <div class="back-btn" onclick="history.back()">
      <i class="fas fa-arrow-left"></i>
    </div>
    <div class="navbar-title">Notificaciones</div>
  </div>
</div>

<!-- CONTENIDO -->
<div class="container">

  <div class="icon-box">
    <i class="fas fa-bell-slash"></i>
  </div>

  <h1>No hay notificaciones</h1>

  <p>
    Por el momento no tienes notificaciones nuevas.
    Cuando haya alguna novedad aparecerá aquí.
  </p>

  <div class="status-badge">
    Información en desarrollo
  </div>

</div>

<footer>
  © 2026 Sxgura Inc. Todos los derechos reservados.
</footer>

</body>
</html>
