<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Información | S'xgura Inc</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
:root{--b:rgba(0,140,255,1);--p:rgba(140,0,255,1)}
body{background:radial-gradient(ellipse at 50% 0%,#0a0f26 0%,#000 60%) #000;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px;overflow-x:hidden}
.info-box{width:100%;max-width:380px;position:relative;background:linear-gradient(180deg,#07070c,#000);border:1px solid #1a1a22;border-radius:24px;padding:28px 24px;
box-shadow:0 0 20px rgba(0,140,255,.35),0 0 44px rgba(140,0,255,.25);animation:fade .6s ease}
.info-box::before{content:"";position:absolute;inset:-1px;border-radius:25px;padding:1px;background:linear-gradient(140deg,rgba(0,140,255,.8),transparent 40%,transparent 60%,rgba(140,0,255,.8));
-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
@keyframes fade{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.profile{display:flex;flex-direction:column;align-items:center;margin-bottom:22px}
.avatar{position:relative;width:98px;height:98px;margin-bottom:16px}
.avatar::before{content:"";position:absolute;inset:-7px;border-radius:50%;background:conic-gradient(from 0deg,var(--b),var(--p),var(--b));filter:blur(9px);opacity:.55;animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.avatar img{position:relative;width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid var(--b);box-shadow:0 0 18px rgba(0,140,255,.4)}
.profile h1{font-size:22px;letter-spacing:.2px;text-align:center;background:linear-gradient(90deg,#fff,#8fc9ff 50%,#fff);-webkit-background-clip:text;background-clip:text;color:transparent}
.info-section{margin-top:6px}
.info-item{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.01));border:1px solid #1b1b24;border-radius:14px;padding:14px;margin-bottom:12px;transition:border-color .25s,box-shadow .25s,transform .25s}
.info-item:hover{border-color:rgba(0,140,255,.8);box-shadow:0 0 12px rgba(0,140,255,.4),0 0 24px rgba(140,0,255,.22);transform:translateY(-1px)}
.label{font-size:11.5px;color:#8a8a99;margin-bottom:7px;display:flex;align-items:center;gap:7px;text-transform:uppercase;letter-spacing:.9px}
.label i{color:var(--b);font-size:12px;width:14px;text-align:center}
.status-dot{width:8px;height:8px;background:#00e676;border-radius:50%;display:inline-block;animation:softPulse 2s ease-in-out infinite}
@keyframes softPulse{0%,100%{opacity:.6;transform:scale(.9);box-shadow:0 0 0 #00e676}50%{opacity:1;transform:scale(1.15);box-shadow:0 0 7px rgba(0,230,118,.5)}}
.value{font-size:15.5px;font-weight:700;color:#fff;word-break:break-word;display:flex;align-items:center;gap:7px}
.badge-verificado{width:17px;height:17px;object-fit:contain}
.timer{display:flex;justify-content:space-between;gap:8px;margin-top:10px}
.time-box{flex:1;background:#05050a;border-radius:12px;padding:10px 4px;text-align:center;border:1px solid #20202b}
.time-box h2{font-size:21px;color:var(--b);font-variant-numeric:tabular-nums;text-shadow:0 0 10px rgba(0,140,255,.6),0 0 20px rgba(140,0,255,.4);margin-bottom:4px}
.time-box span{font-size:10.5px;color:#9a9aa8;text-transform:uppercase;letter-spacing:.6px}
.footer{margin-top:10px;text-align:center;font-size:12px;color:#666}
.glow{color:#f00;text-shadow:0 0 10px rgba(255,0,0,.7)}
@media (max-width:340px){.info-box{padding:22px 16px}.time-box h2{font-size:18px}}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>
</head>

<body>

<div class="info-box">

<!-- PERFIL -->
<div class="profile">
  <div class="avatar">
    <img src="https://i.ibb.co/FNgtpdx/IMG-20260406-001315-178.jpg" alt="Sxgura Inc">
  </div>
  <h1>R E G I S T R O</h1>
</div>

<!-- INFO -->
<div class="info-item">
  <div class="label"><i class="fas fa-building"></i>Asociación</div>
  <div class="value">
    Sxgura Inc Empresa
    <img src="https://i.ibb.co/bMWTtN4M/file-00000000c864720eab00a08370862ecb.png" alt="Verificado" class="badge-verificado">
  </div>
</div>


<div class="info-item">
  <div class="label"><i class="fas fa-headset"></i>Asistencia</div>
  <div class="value">
    ENDO V XR
    <img src="https://i.ibb.co/SDy8pkzW/1791413782691.png" alt="Verificado" class="badge-verificado">
  </div>
</div>


<div class="info-item">
  <div class="label"><i class="fas fa-rocket"></i>Lanzamiento</div>
  <div class="value">
    22 de abril de 2026
  </div>
</div>

<div class="info-item">
  <div class="label"><i class="fas fa-code-branch"></i>Versión</div>
  <div class="value">v16.4.8</div>
</div>

<!-- ACTIVIDAD -->
<div class="info-section">
  <div class="info-item">
    <div class="label">
      <i class="fas fa-clock"></i>Tiempo de actividad
      <span class="status-dot"></span>
    </div>

    <div class="timer">
      <div class="time-box">
        <h2 id="days">00</h2>
        <span>Días</span>
      </div>

      <div class="time-box">
        <h2 id="hours">00</h2>
        <span>Horas</span>
      </div>

      <div class="time-box">
        <h2 id="minutes">00</h2>
        <span>Min</span>
      </div>

      <div class="time-box">
        <h2 id="seconds">00</h2>
        <span>Seg</span>
      </div>
    </div>

  </div>
</div>

<!-- FOOTER -->
<div class="footer">
  <span class="glow"></span>
</div>

</div>

<script>

const startDate = new Date("2026-04-22T00:00:00").getTime();

function updateTimer(){

const now = new Date().getTime();
const distance = Math.max(0, now - startDate);

document.getElementById("days").innerText =
String(Math.floor(distance / (1000 * 60 * 60 * 24))).padStart(2,"0");

document.getElementById("hours").innerText =
String(Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60))).padStart(2,"0");

document.getElementById("minutes").innerText =
String(Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60))).padStart(2,"0");

document.getElementById("seconds").innerText =
String(Math.floor((distance % (1000 * 60)) / 1000)).padStart(2,"0");

}

setInterval(updateTimer,1000);
updateTimer();

</script>

</body>
</html>
